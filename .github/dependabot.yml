# Dependency updates for a PUBLIC repository (ADR-0017). This repository carries
# no package manifest — no Cargo.toml, no package.json — so its whole
# third-party surface is the GitHub Actions its four workflows invoke, held at
# major tags (`.github/pins.toml`, policy `floating`) plus one actionlint
# container held by digest (`immutable`, out of Dependabot's reach on purpose).
# A tag can move under CI with nothing in any diff; Dependabot is what turns
# that into a reviewed edit.
#
# Every action here is also a registered pin, so a bump PR this file opens is a
# registry edit too: `tools/check-pins.py` reds a `uses:` value that moved
# without its `.github/pins.toml` entry moving with it, so the bump commit
# updates the matching pin's `value` in the same diff or the pin gate reds the
# PR by surprise.
#
# Grouped and weekly on purpose, mirroring the engine repository's
# `.github/dependabot.yml`: an ungrouped daily schedule on seven actions is a
# pull request stream nobody reads.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
