all 39 pieces with both binaries, `lighting` agrees on all 39, which is that
commit's claim measured on this library rather than accepted; it is also the loss
of the anchor. So one was built instead. A third worktree at the new revision,
with a single suffix deleted from the `audit` path's own allowlist and the binary
rebuilt, reds 9 of the 39 units and moves 9 report files — the comparison above is
demonstrably able to register a change in the judge, and the perturbed tree was
discarded rather than kept. Re-derived rather than carried, since it is a
measurement of a library that moves: all 39 units carry a `lighting` block and the
probe's own profile disagrees with 5 of them, identically under both instruments,
and reds nothing because nothing asks.

The reading below is the PREVIOUS interval's, `800c958e..b65783e8`. It is kept
because its module-level account of what the `audit` path actually reaches, and
of which doors this library never opens, is the whole reason this judgement was
cheap; its figures are that interval's and not this one's.

THE READING, so the next one does not have to repeat it. Across
800c958e..b65783e8, 32 commits landed upstream and 16 of them touch the watch
closure, which is why the red names sixteen and still says nothing about a
verdict. The question the closure cannot answer is answered one level down, by
asking of every file the `audit` path compiles whether it moved at all. Of 34
such files — the admit modules `main`, `lib`, `cli`, `allowlist`, `audit`,
`diag`, `settling`, `spatial`, `structure`; the schem modules `lib`, `convert`,
`diag`, `fluid`, `nav`, `nbt`, `prefab`, `stairs`; the grammar modules `lib`, `block`,
`geom`, `model`, `settle`, `contract`, `gates`, `nav`; the dsl modules `lib`,
`blocks`, `blockshape`, `split`, `prefab`, `metrics`, `registry`, `ids`,
`diagnostic` — 22 are byte-identical, 11 moved and 1 (`blockshape`) is new.

BUCKETED BY COMMIT, because the red names sixteen and the next reader will be
holding that list. Seven of the sixteen touch no file the `audit` path compiles
at all — `7e8f52c0`, `02e5edf2`, `7a7a91ff`, `dac05918`, `ecf1b8d4`, `01f80a51`,
`39d2f3dd` — and each reaches only `crates/compiler`, or `crates/dsl`'s `stages`
and `validate`, which is where a campaign document is judged. Of the nine that
do, five touch only `crates/dsl`'s `lib` (module declarations and re-exports,
nothing removed): `dd287282`, `8b9c253c`, and the `lib` half of `c215012c`,
`86944766`, `b65783e8`. Four touch the door-gated modules and nothing else this
library opens — `b18d7564` and `41f629a1` (`grammar`'s `contract`, `gates`,
`nav`), `18206ebe` (`grammar/nav`), and the `metrics`/`diagnostic`/`registry`
halves of `c215012c`, `86944766`, `41f629a1` and `b65783e8`. Exactly ONE commit,
`90cf2051`, changes a rule this library executes: the collision table it adds as
`dsl/blockshape`, the `schem/fluid` delegation onto it, the `schem/lib`
re-export that lets `fluid` spell it, and the `classes` vector on
`grammar/model`. That is the commit the comparison below is really about.

THE TWELVE THAT MOVED, sorted by whether this library can reach them, because
that is the whole of the judgement. FIVE are executed on every piece here and
are what the comparison below actually tests: `dsl/blockshape` is the new
collision authority; `schem/fluid`'s `is_fluid` and `is_air` stop carrying their
own lists and delegate to it; `schem/lib` gains the one `pub use` that lets them;
`grammar/model` gains a `classes` vector written beside the palette and a
`collision()` reader for it, additive, with a hand-written `PartialEq` over the
same fields the derive covered; `dsl/lib` gains module declarations and
re-exports and removes none. SEVEN cannot be reached from this library at all, and
each is stopped by a door this repository does not open: `grammar/contract`,
`grammar/gates` and `grammar/nav` are entered only from `contract::check`, which
`Door::open` calls only after it has found a `spatial_contract` in a piece's
declaration document, and `schem/nav` — where the walk itself lives — is entered
only from `grammar/nav`, so it sits behind that same door; `dsl/metrics` and `dsl/diagnostic` are entered only from
`audit::footprint_class`, which returns before either when the document declares
no `footprint_class`; and `dsl/registry` gains a vanilla entity-tag table that
nothing on this path asks for — the audit path takes only the `Lighting` and
`LightingProfile` types from it.

MEASURED RATHER THAN ARGUED, because a linkage read off imports is a claim and a
verdict is a fact. Two judges were built from two detached worktrees of two
separate checkouts, each with its own `target/`, under the pinned 1.97.1
toolchain that both revisions name, cargo's exit status asserted on its own line
for each. `tools/prefab-audit.py` then ran each over the whole repository: 39
audited units over 39 in-scope `.nbt` files, 4 roots, 0 disowned by git, PASS 39
of 39 under both. All 39 report files are byte-identical across the two, and so
is the whole of each run's stdout and its 82-line diagnostic stream. The pinned
judge was run a second time into a third directory and reproduced itself
byte-for-byte, so "identical" is a statement about the two instruments and not
about a tool that varies. The move changes no verdict this library receives.

WHAT THAT ZERO IS A ZERO OVER, since a byte-identical result has to say what it
examined: 94,113 blocks, a 76-entry union of distinct block ids, 482 stairs put
through the derived-shape rule, 1,954 fluid cells put through the containment
rule, 672 run directions counted at a piece's own face, 109 anchors. The one
changed rule those numbers run through is the fluid/air delegation, and it was
cross-checked by a second method with an unrelated failure mode: both
predicates re-derived from their source and evaluated over the 76 ids the
library actually contains, where they disagree on 0. They cannot disagree here —
the old pair normalised a bare id up to `minecraft:` and the new pair normalises
`minecraft:` away, which is the same partition; the new pair also strips a block
state, and no input carries one, because `spatial::grid` puts the state in
`BlockState::properties` and `settle` passes `name`.

AND THE COMPARISON IS NOT VACUOUS, which a byte-identical result always has to
answer for. The same two binaries over the same 39 pieces disagree on `lighting`
for 11 of them — `prefabs/cave-cavern.nbt` alone moves from 94 standable cells
to 92 — so the instruments are demonstrably different, the difference is
observable in this library, and it does not reach `audit`.

WHAT THE RULE SET DID, which is a different question from whether a verdict moved
and is the one that decides a HOLD. It did not gain or lose a refusal on this
path: every audit-path module that raises one is byte-identical, and the two
built binaries carry the identical set of 22 `DW` codes, read out of the BUILT
BINARIES rather than out of the source that produced them. What DID move is the
behaviour behind the spatial-contract door — the walk, the gates and the
contract checker are substantially rewritten — and this library opens that door
zero times. That is a clearance with a scope, and the scope is stated here
rather than left to be discovered: it is true for pieces that declare no
`spatial_contract`, which is all 39 today, and the first piece that declares one
is judged by rules this reading did not compare.

Holding the pin is nonetheless the worse of the two states, for the reason the
previous judgement gave and this interval sharpens. The old instrument's
navigation model credits a body with standing on open water and treats a torch,
a candle, a carpet and a pressure plate as walls; both are corrected upstream in
this interval. A pin held at a known-wrong instrument to avoid a bump that
provably changes no verdict is not caution.

THE DOORS in the audit path where a change moves a verdict, and each opens only
on a declaration the piece itself makes. The spatial contract opens on a piece
whose declaration document carries a `spatial_contract`; a piece that declares
none is reported `undeclared` with `DW0783`, and no obligation runs over it — all
39 report `"state": "undeclared"`. The footprint class opens on a piece whose
declaration document carries a `footprint_class`, and is silent with a stated
zero on a piece that declares none — all 39 print `0 declared class(es) judged
over 1 declaration document(s) read`. Because that rule consults the metrics
table, `crates/dsl`'s `metrics` module is a live input to a verdict for any piece
that declares a class. No piece in this repository declares either today, which
is a fact about the library and not a property of the gate.

A `reviewed` VALUE IS A DATE, NOT A CLEARANCE. It says this pin was judged
against upstream as of that revision and says nothing about any commit after it;
upstream moving reds this check again, which is the mechanism working rather than
failing.

That is not hypothetical and it is worth the sentence, because it decides how the
next judgement is run. An earlier judgement began against a head of 89e5297e and
the pipeline's default branch fast-forwarded to 800c958e WHILE it was in
progress — so the first answer was already stale when it was written, and the
commit that arrived was the only one in the interval that touched a file the
`audit` path compiles. The check caught it, which is what it is for. The habit
that follows, and that this judgement kept: re-read the pipeline's head
immediately before committing a bump, and take every figure at a named revision
rather than at "the head", because the head is a value that moves.

WHAT THIS PIN CARRIES THAT NOTHING RUNS, stated because the next reader of this
entry is the one who needs it. `audit` is the only subcommand any job here
invokes; `delve-admit lighting` is invoked by no workflow, no tool and no test,
so every `lighting` block in a prefab's metadata is written by hand or by a run
somebody chose to make, and a hand-written number over a measured one reds
nothing. Measured against the instrument this pin now names: all 39 units carry a
`lighting` block, and the probe's own profile disagrees with 5 of them —
`hello-room` declares `lit` where the probe binds no cell at all, three demo
pieces declare `unmeasured` and the probe answers `dark`, `unbound` and `lit`,
and `hero-galleon-oak` declares `lit` where the probe now answers `dark`. Four of
those five disagree under the old instrument too; the fifth is the bump's own
doing, and it reds nothing because nothing asks. A figure of this kind is a
measurement of a library that moves, so it is re-derived at each judgement rather
than carried.

WHAT `vendors` DECLARES, and why it is a pin's business at all.
`tools/check-pins.py` is ONE tool with two copies: the pipeline's is the source,
this repository's is a verbatim copy. `vendors` names the paths here that are
copies of the same paths in the pinned checkout, and `tools/check-vendored.py`
holds them to it — byte-for-byte against `value`, plus a refusal when the source
has moved upstream since `reviewed`. That second half is what keeps the guarantee
alive between re-pins: byte-identity against a frozen revision is satisfied
forever by never looking. That half has now fired once and been answered: the
current reading's interval rewrote the file upstream, and the copy here was
re-vendored byte-for-byte from the engine at the new `value` in the same commit
as the bump, because a bump that leaves the copy behind claims a verbatim copy
of a file that no longer exists.

The two copies once differed by one constant naming directories to skip. It
matched zero tracked files in the pipeline repository, so it was inert and
correct where it was written; carried here, where `campaigns/` IS the content, it
removed 27 tracked files — every campaign stage document — from both pin
discovery and the fetch-verb enumeration. Nothing was red, because a file the
enumeration never lists cannot be reported as unexamined. The checker no longer
carries a per-repository claim at all, which is what makes a verbatim copy
possible; `vendors` is what stops one being edited back into existence here.
"""

[[pin]]
id = "engine-release"
value = "91a9a843d2ad2f0c3b852ea5fa4178567b68f875"
sites = ["versions.toml"]
repo = "stellarfeline/delvewright"
policy = "release"
judged_by = ".github/workflows/prefab-audit.yml"
why = """
The tagged engine release a delve image is built and validated with
(versions.toml [engine]). A released delve reproduces through its own pinned
engine and through nothing else, so this pin must never move for the sake of
newer behaviour — it moves only when a release deliberately adopts a newer
engine. `release` is checked, not asserted: the value must be a commit a
v<semver> tag points at, which a commit somebody merely stopped looking at
cannot be.
"""

[[pin]]
id = "engine-authoring"
value = "c5b7105fdf4a262b479e2f9bf114813bd77dee19"
sites = ["versions.toml"]
repo = "stellarfeline/delvewright"
policy = "track"
judged_by = ".github/workflows/prefab-audit.yml"
reviewed = "c5b7105fdf4a262b479e2f9bf114813bd77dee19"
builds = []
# `tools/check-skill-version.py` holds the skill page's frontmatter and prose to
# this engine, and two of the things it asks are questions the engine already
# answers in code: how the §2c idiom index table is parsed, and every prose
# phrasing that states its size. Those are copied rather than re-implemented,
# because a markdown parse rule re-written per gate is the private-copy defect
# CLAUDE.md names — and a copy is only worth more than a re-implementation while
# something proves it is still the same file, which is what `check-vendored.py`
# does with these two.
vendors = ["tools/check-stated-counts.py", "tools/lib/mdtable.py"]
why = """
The engine an AUTHOR builds their own toolchain from (versions.toml
`[engine].authoring_ref`) — the revision `/new-delve` Init step 2 checks out and
builds, and therefore the revision every picture, refusal and diagnostic in a
generation run comes from. Its reader is the skill page, which extracts it from
`versions.toml` and never restates it.

WHY IT IS NOT THE RELEASE PIN, since both name the same repository. `ref` answers
"which engine would ship this content", and a released delve reproduces through
that engine and nothing else, so it must never move for the sake of newer
behaviour. This answers "which engine does somebody author with", and it moves
whenever the authoring pipeline has been walked against a newer one. Pointing an
author at the release pin would hand them the newest RELEASED engine — months of
authoring fixes behind whatever the skill was last walked with — and pointing
them at neither is what was happening before this pin existed: the page told the
author to clone the engine and named no revision at all, so the toolchain moved
under them while they worked.

THE TERM, and it is `track`'s and not a new one. The value must be a commit the
engine's DEFAULT BRANCH carries. That is not an accident of the vocabulary
fitting; it is the property the pin actually needs. The reader of this pin is a
stranger with a clone and no other context, and their Init has to FETCH the
revision from the public remote. A commit reachable only from a topic branch can
be force-pushed away or deleted with the branch, and the author's fetch then
fails with `not our ref <sha>` before a single binary is built — a failure that
names a hash and no cause. The default branch is the one ref this project does
not rewrite, so "a commit the default branch carries" is exactly the demand that
makes the revision fetchable by anybody, indefinitely. The defect cannot supply
it: a sha somebody typed, truncated, or took from a local-only clone is not on
that branch, and neither is a revision whose branch was thrown away.

`release` WOULD BE THE WRONG TERM, not a stricter one. It demands a v<semver> tag
at the value, and an authoring engine is deliberately AHEAD of the newest
release — that lag is the thing this pin exists to remove. `immutable` and
`floating` are refused outright for a repository this project builds, and
correctly: a pin onto our own history is judged, or it is a published tag, and it
is not exempt by being renamed.

`builds` IS EMPTY, AND THE EMPTY WATCH IS THE DESIGN. The drift half of `track`
derives its watch set from the packages the SITE builds out of the pinned
checkout, and the site is `versions.toml`, which builds nothing. The alternative
is not a narrower watch but an absurd one: an author builds the whole engine
workspace, so a watch derived from what they build would be the entire `crates/`
tree and would red on every upstream commit forever. A gate that is always red is
one a reader learns to wave through, which is the opposite of a gate. So drift
from the default branch is deliberately NOT a finding for this pin, for the same
reason it is not one for `release`: what an author needs is the engine the
pipeline was WALKED against, not the newest one.

WHAT WOULD MAKE IT STALE, then, and what would make staleness a finding. It is
stale when the engine has fixed an obstacle an author hits — a refusal with no
reachable remedy, a step that cannot be completed — and this pin still names the
tree without the fix; and equally when the skill gains a step written against a
newer engine while the pin stays behind, which is the same defect pointed the
other way. Neither is machine-detectable from this repository, and saying so is
the honest half: staleness here is established by WALKING `/new-delve` Init end
to end against a candidate revision, which is what produces a new `reviewed`, and
no job in this repository can perform that walk. `reviewed` and `value` name the
same revision because this pin was created by such a walk rather than inherited
from an older one.

WHAT ACTUALLY RUNS, because a pin whose only reader is prose is a doc line. Six
readers, each catching a different bad edit, none of them able to substitute for
another:

  - `tools/check-pins.py` (offline, required job): the value is discovered in
    `versions.toml` and must carry an entry here; editing the pin without editing
    this file reds as an unregistered pin, and this entry keeping a value the file
    no longer holds reds as a registry that drifted from its site.
  - `.github/workflows/prefab-audit.yml` fetches the revision by sha into the
    pinned engine checkout, which is the author's own fetch performed in CI: a
    revision the remote will not serve fails there with `not our ref`, in the same
    words the author would have seen.
  - `tools/check-pins.py --online` (same job): a value naming no commit reds as
    "the pin names nothing", and a value the default branch does not carry reds by
    name. That is the term above, enforced.
  - `tools/check-authoring-pin.py` (same job): the value is a full 40-hex
    revision rather than a branch or tag name, the skill page really READS
    `authoring_ref`, and the revision string appears in no other tracked file.
    That last is not reachable from `check-pins.py` by design — markdown is prose
    to it, and is deliberately outside pin discovery — yet the skill page is
    executed by a person and is exactly where a second copy of the revision would
    be pasted.
  - `tools/check-skill-version.py` (same job): the first reader that uses the
    revision as an INSTRUMENT rather than judging the literal. It materialises
    the engine at this value and holds the skill page's `requires:` window,
    `verified_with`, every `delvec` subcommand and flag the page names, every
    campaign stage document the engine defines, and every number the page states
    about the idiom index, against that one engine. So this pin now decides a
    verdict: move it to an engine whose CLI has dropped a subcommand the page
    drives, and the page reds — which is the point, because that is exactly what
    an author would hit at Init step 2, and the alternative was finding out
    during their run.
  - `tools/check-vendored.py` (same job): the two files this entry declares in
    `vendors` are byte-identical to the engine's at this revision. They are the
    idiom-index oracle and the markdown-table parser the reader above imports —
    not maintained here, so an edit in place is a red rather than a fork.
"""

