# THE PIN REGISTRY — every literal in this repo that decides which version of an
# external thing gets fetched, with the policy that says whether it may drift.
#
# `tools/check-pins.py` reads this file; its docstring is the full account of the
# discovery, the policies, and why the reason lives here rather than in a comment
# beside the value. The short form: a pin that has rotted and a pin that is frozen
# on purpose look identical in a diff, and only a machine-checked policy tells
# them apart.
#
# This repository is the one where that distinction was paid for. Its audit
# workflow built its judge from a pinned pipeline commit and the pin sat while
# the rule it enforced was settled upstream, so a zone was reported red for
# failing a rule that no longer existed — and the repair a reader naturally
# reaches for is to build the thing the stale gate asks for, which is the exact
# vacuity the gate was written to catch.

[[pin]]
id = "admit-ref"
value = "ed39b9c73008ed980e77e1c28a358c297649d282"
sites = [".github/workflows/prefab-audit.yml"]
repo = "stellarfeline/delvewright"
policy = "held"
judged_by = ".github/workflows/prefab-audit.yml"
reviewed = "ed39b9c73008ed980e77e1c28a358c297649d282"
vendors = ["tools/check-pins.py"]
why = """
WHAT THIS PIN IS. The pipeline command `delvec prefab audit` — the audit every
piece in this repository must pass — is built from. It is an INSTRUMENT: its
verdicts decide what enters the library, so it is pinned rather than floating,
and its currency is judged rather than assumed. It is judged as one unit with
`.github/workflows/prefab-audit.yml`, the site that builds it, rather than
re-pinned on every upstream merge: the question this pin answers is "does the
library still admit clean by the pinned judge", not "is this the upstream tip".

WHAT THE JUDGE IS BUILT FROM, and why no closure is stated. ADR-0023 folded the
standalone `delve-admit` binary into one creator binary, `delvec`, whose
subcommand tree also carries `validate`/`build`/`snapshot`/`render` and every
other surface ADR-0012 lists. `cargo build -p delvec --bin delvec` therefore
compiles the whole workspace — `crates/dsl`, `crates/compiler`, `crates/schem`,
`crates/admit`, `crates/grammar`, `crates/orchestrator`, `crates/render` are all
linked into the one binary this site builds, regardless of which subcommand a
run invokes. The prior scoped closure (admit's own subcommand pulling in
schem/grammar/orchestrator/dsl but never compiler) was a fact about
`delvewright-admit`'s narrower dependency graph, and it no longer holds now
that the site builds `delvec`: naming a closure here would claim a precision
the build no longer has. This is the strongest form of the case for `held`
over `track` — a per-merge watch over "the whole workspace" is exactly the
absurd, always-red watch `engine-authoring`'s own entry refuses to derive, and
`delvec` now puts every `admit-ref` site in that same shape.

THE METHOD an offline reader should expect from a DW-code count, stated once
because it stops applying here rather than because it changed: `grep -aoE
'DW[0-9]{4}'` over built bytes, never `strings` (the literals live in a packed
string table `strings` splits between them, so it under-reports). Reading it
off `delvec` counts every DW code in the whole pipeline the binary links, not
the audit subcommand's own — a fact about the one-binary shape, not a
regression in the count.

WHAT THE STANDING AUDIT RULE FOUND, and it is unchanged by this move.
`license.generated_by` requires a `region` field — `[x, y, z]`, the box the
program was expanded over, an independent input because the same program at
the same seed over a different box is a different building. This library's
three programs that carry a `generated_by` block — `gatehouse_elevations`,
`signal_station`, `mill_race` — carry the field the newer `GeneratedBy` struct
requires; nothing about that adoption changes here.

WHAT THIS MOVE DID, and what was measured for it. Two things landed together,
because upstream put them in the same interval: `tools/check-pins.py` gains
`held` (this pin's own policy), and ADR-0023 retires the `delve-admit` binary
this site built, so moving to an engine that carries `held` at all forces the
same move past the retirement. `delvec` was built fresh (`cargo build -p delvec
--bin delvec --release`, exit 0, from a detached worktree at this pin's value,
`cargo 1.97.1` / `rustc 1.97.1`) and `delvec prefab audit --help` was read
directly off that binary to confirm the surface `delve-admit audit` exposed
survives unchanged under `delvec prefab audit` — same arguments
(`<NBT>`, `--allowlist`, `-o`/`--report`), no `--prefabs` consulted by the audit
path. `tools/prefab-audit.py` was updated to invoke that shape and then run
against the whole repository with the fresh binary: 39 audited units over 39
in-scope `.nbt` files, PASS 39 of 39 at exit 0 — the same count and verdict the
library held before this move, so the binary rename changed nothing about what
is admitted. `.github/workflows/prefab-audit.yml`'s build and invoke steps move
to `delvec` alongside the pin, for the same reason: a pin whose site still
named a binary the pinned revision no longer produces would not build at all.

WHY THIS PIN IS `held` AND NOT `track`. `value` is the revision the tool is
BUILT from; `reviewed` is the revision its upstream history has been JUDGED
against; the two are allowed to differ while a newer instrument is not yet
adoptable, and agree once the judgement's conclusion is that the newer
instrument is the one this library should be held to, which is where they
stand now. A `track` pin's per-merge red is the wrong shape for this site: with
the whole workspace now in scope, it would red on any upstream merge at all,
and `builds = []` cannot silence it honestly because the site really does build
`delvec`. `held` carries no `builds` at all — there is no watch set to derive —
and instead demands `judged_by`, `reviewed` and this `why`, so a hold is
deliberate and not silent: `judged_by` names the workflow that actually builds
this pin's value, `reviewed` names the upstream commit the judgement above
read, and this text says what interval was judged and what it found. Upstream
drift past `value` is not a finding under this policy; the library adopts what
a newer instrument requires first, and the pin follows.

WHAT THE VENDORED COPY IS. `tools/check-pins.py` — this file's own checker — is
declared in `vendors`: it is ONE tool with two copies, this repository's is
verbatim, and `tools/check-vendored.py` reds on a local edit. The `held` policy
itself is written in the engine and arrives here as a re-vendor and a re-pin,
never maintained twice.
"""

[[pin]]
id = "engine-release"
value = "91a9a843d2ad2f0c3b852ea5fa4178567b68f875"
sites = ["versions.toml"]
repo = "stellarfeline/delvewright"
policy = "release"
judged_by = ".github/workflows/prefab-audit.yml"
why = """
The tagged engine release a delve image is built and validated with
(versions.toml [engine]). A released delve reproduces through its own pinned
engine and through nothing else, so this pin must never move for the sake of
newer behaviour — it moves only when a release deliberately adopts a newer
engine. `release` is checked, not asserted: the value must be a commit a
v<semver> tag points at, which a commit somebody merely stopped looking at
cannot be.
"""

[[pin]]
id = "engine-authoring"
value = "cdee147ed5efcede01b8f5b9c781a64b86b57a13"
sites = ["versions.toml"]
repo = "stellarfeline/delvewright"
policy = "track"
judged_by = ".github/workflows/prefab-audit.yml"
reviewed = "cdee147ed5efcede01b8f5b9c781a64b86b57a13"
builds = []
# `tools/check-skill-version.py` holds the skill page's frontmatter and prose to
# this engine, and three of the things it asks are questions the engine already
# answers in code: how the §2c idiom index table is parsed, every prose phrasing
# that states its size, and what `delvec`'s clap command surface IS. Those are
# copied rather than re-implemented, because a parse rule re-written per gate is
# the private-copy defect CLAUDE.md names — and a copy is only worth more than a
# re-implementation while something proves it is still the same file, which is
# what `check-vendored.py` does with these three.
#
# `clap_surface.py` is here because the private copy failed, not as tidiness.
# ADR-0023 spread `delvec`'s surface across crates — the CPU render arms are
# `#[command(flatten)]`ed in from `crates/compiler`, the grammar / prefab /
# schem / harvest / render surfaces are mounted from theirs — and the local
# parser, written when one crate held everything, saw 17 of 24 subcommands and
# called the other seven commands the CLI does not have. The engine's parser is
# written for the mounted shape and is the same one
# `tools/build-release-binaries.sh` holds a BUILT binary's `--help` against, so
# one parse rule now answers for the release artifact and for this page.
vendors = ["tools/check-stated-counts.py", "tools/lib/clap_surface.py", "tools/lib/mdtable.py"]
why = """
The engine an AUTHOR builds their own toolchain from (versions.toml
`[engine].authoring_ref`) — the revision `/new-delve` Init step 2 checks out and
builds, and therefore the revision every picture, refusal and diagnostic in a
generation run comes from. Its reader is the skill page, which extracts it from
`versions.toml` and never restates it.

WHY IT IS NOT THE RELEASE PIN, since both name the same repository. `ref` answers
"which engine would ship this content", and a released delve reproduces through
that engine and nothing else, so it must never move for the sake of newer
behaviour. This answers "which engine does somebody author with", and it moves
whenever the authoring pipeline has been walked against a newer one. Pointing an
author at the release pin would hand them the newest RELEASED engine — months of
authoring fixes behind whatever the skill was last walked with — and pointing
them at neither is what was happening before this pin existed: the page told the
author to clone the engine and named no revision at all, so the toolchain moved
under them while they worked.

THE TERM, and it is `track`'s and not a new one. The value must be a commit the
engine's DEFAULT BRANCH carries. That is not an accident of the vocabulary
fitting; it is the property the pin actually needs. The reader of this pin is a
stranger with a clone and no other context, and their Init has to FETCH the
revision from the public remote. A commit reachable only from a topic branch can
be force-pushed away or deleted with the branch, and the author's fetch then
fails with `not our ref <sha>` before a single binary is built — a failure that
names a hash and no cause. The default branch is the one ref this project does
not rewrite, so "a commit the default branch carries" is exactly the demand that
makes the revision fetchable by anybody, indefinitely. The defect cannot supply
it: a sha somebody typed, truncated, or took from a local-only clone is not on
that branch, and neither is a revision whose branch was thrown away.

`release` WOULD BE THE WRONG TERM, not a stricter one. It demands a v<semver> tag
at the value, and an authoring engine is deliberately AHEAD of the newest
release — that lag is the thing this pin exists to remove. `immutable` and
`floating` are refused outright for a repository this project builds, and
correctly: a pin onto our own history is judged, or it is a published tag, and it
is not exempt by being renamed.

`builds` IS EMPTY, AND THE EMPTY WATCH IS THE DESIGN. The drift half of `track`
derives its watch set from the packages the SITE builds out of the pinned
checkout, and the site is `versions.toml`, which builds nothing. The alternative
is not a narrower watch but an absurd one: an author builds the whole engine
workspace, so a watch derived from what they build would be the entire `crates/`
tree and would red on every upstream commit forever. A gate that is always red is
one a reader learns to wave through, which is the opposite of a gate. So drift
from the default branch is deliberately NOT a finding for this pin, for the same
reason it is not one for `release`: what an author needs is the engine the
pipeline was WALKED against, not the newest one.

WHAT WOULD MAKE IT STALE, then, and what would make staleness a finding. It is
stale when the engine has fixed an obstacle an author hits — a refusal with no
reachable remedy, a step that cannot be completed — and this pin still names the
tree without the fix; and equally when the skill gains a step written against a
newer engine while the pin stays behind, which is the same defect pointed the
other way. Neither is machine-detectable from this repository, and saying so is
the honest half: staleness here is established by WALKING `/new-delve` Init end
to end against a candidate revision, which is what produces a new `reviewed`, and
no job in this repository can perform that walk. `reviewed` and `value` name the
same revision because each was set by such a walk rather than inherited from an
older one. The walk that moved them to `66906e39` built the engine from source
at that revision from inside the clone, so its own `rust-toolchain.toml` pin
applied and `cargo` and `rustc` both answered `1.97.1`; `delvec --version` then
answered `1.1.0`, inside the skill's declared `requires.delvec` window; and the
run carried on through the page and authored a campaign against that toolchain
as far as the design gate. What that walk did NOT do is hold the gate, which is
the user's and had no user present. So this `reviewed` attests that Init
completes and that the authoring steps BEFORE the gate run at this engine, and
attests nothing about the steps after it.

WHAT ACTUALLY RUNS, because a pin whose only reader is prose is a doc line.
Six readers, each catching a different bad edit, none of them able to
substitute for another:

  - `tools/check-pins.py` (offline, required job): the value is discovered in
    `versions.toml` and must carry an entry here; editing the pin without editing
    this file reds as an unregistered pin, and this entry keeping a value the file
    no longer holds reds as a registry that drifted from its site.
  - `.github/workflows/prefab-audit.yml` fetches the revision by sha into the
    pinned engine checkout, which is the author's own fetch performed in CI: a
    revision the remote will not serve fails there with `not our ref`, in the same
    words the author would have seen.
  - `tools/check-pins.py --online` (same job): a value naming no commit reds as
    "the pin names nothing", and a value the default branch does not carry reds by
    name. That is the term above, enforced.
  - `tools/check-authoring-pin.py` (same job): the value is a full 40-hex
    revision rather than a branch or tag name, the skill page really READS
    `authoring_ref`, and the revision string appears in no other tracked file.
    That last is not reachable from `check-pins.py` by design — markdown is prose
    to it, and is deliberately outside pin discovery — yet the skill page is
    executed by a person and is exactly where a second copy of the revision would
    be pasted.
  - `tools/check-skill-version.py` (same job): the one reader that uses the
    revision as an INSTRUMENT rather than judging the literal. It materialises
    the engine at this value and holds the skill page's `requires:` window,
    `verified_with`, every `delvec` subcommand and flag the page names, every
    campaign stage document the engine defines, and every number the page states
    about the idiom index, against that one engine. So this pin now decides a
    verdict: move it to an engine whose CLI has dropped a subcommand the page
    drives, and the page reds — which is the point, because that is exactly what
    an author would hit at Init step 2, and the alternative was finding out
    during their run.
  - `tools/check-vendored.py` (same job): the two files this entry declares in
    `vendors` are byte-identical to the engine's at this revision. They are the
    idiom-index oracle and the markdown-table parser the reader above imports —
    not maintained here, so an edit in place is a red rather than a fork.
"""

[[pin]]
id = "actionlint-image"
value = "sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"
sites = [".github/workflows/workflow-lint.yml"]
policy = "immutable"
why = """
The actionlint container the workflow lint runs, held by digest so the gate is
the same gate every time. Third-party bytes: its currency is a supply-chain
question with a different owner, and this gate does not pretend to answer it.
"""

