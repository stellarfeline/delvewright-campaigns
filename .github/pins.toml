tool is BUILT from; `reviewed` is the revision its upstream history has been
JUDGED against. They answer different questions and they are allowed to differ.
They do not differ here, because the judgement's conclusion was that the newer
instrument is the one this library should be held to — so the pin moved to it
rather than being held behind it.

