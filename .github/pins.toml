that follows, and that this judgement kept: re-read the pipeline's head
immediately before committing a bump, and take every figure at a named revision
rather than at "the head", because the head is a value that moves.

WHAT THIS PIN CARRIES THAT NOTHING RUNS, stated because the next reader of this
entry is the one who needs it. `audit` is the only subcommand any job here
