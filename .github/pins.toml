Holding the pin is nonetheless the worse of the two states, for the reason the
previous judgement gave and this interval sharpens. The old instrument's
navigation model credits a body with standing on open water and treats a torch,
a candle, a carpet and a pressure plate as walls; both are corrected upstream in
this interval. A pin held at a known-wrong instrument to avoid a bump that
provably changes no verdict is not caution.

THE DOORS in the audit path where a change moves a verdict, and each opens only
on a declaration the piece itself makes. The spatial contract opens on a piece
whose declaration document carries a `spatial_contract`; a piece that declares
