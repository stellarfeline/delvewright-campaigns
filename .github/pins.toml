# THE PIN REGISTRY — every literal in this repo that decides which version of an
# external thing gets fetched, with the policy that says whether it may drift.
#
# `tools/check-pins.py` reads this file; its docstring is the full account of the
# discovery, the policies, and why the reason lives here rather than in a comment
# beside the value. The short form: a pin that has rotted and a pin that is frozen
# on purpose look identical in a diff, and only a machine-checked policy tells
# them apart.
#
# This repository is the one where that distinction was paid for. Its audit
# workflow built its judge from a pinned pipeline commit and the pin sat while
# the rule it enforced was settled upstream, so a zone was reported red for
# failing a rule that no longer existed — and the repair a reader naturally
# reaches for is to build the thing the stale gate asks for, which is the exact
# vacuity the gate was written to catch.

[[pin]]
id = "admit-ref"
value = "968f7d87bfbbef85456a7701ceeb14edb82d09fa"
sites = [".github/workflows/prefab-audit.yml"]
repo = "stellarfeline/delvewright"
policy = "track"
judged_by = ".github/workflows/prefab-audit.yml"
reviewed = "8abcd1acf203000804b4be6602906b8a157e42ab"
builds = ["delvewright-admit"]
vendors = ["tools/check-pins.py"]
why = """
WHAT THIS PIN IS. The pipeline commit `delve-admit` — the audit every piece in
this repository must pass — is built from. It is an INSTRUMENT: its verdicts
decide what enters the library, so it is pinned rather than floating, and its
currency is judged rather than assumed.

HOW IT MOVES. Deliberately, and only in a change that says what interval it
judged. `value` is the revision the tool is BUILT from; `reviewed` is the
revision its upstream history has been JUDGED against. They answer different
questions and are allowed to differ: they differ when the newer instrument is
one this library cannot adopt yet, and they agree when the judgement's
conclusion is that the newer instrument is the one this library should be held
to.

WHY DRIFT IS A FINDING HERE, and is not one for `engine-authoring` next door.
`builds` names the package the site builds out of the pinned checkout, and this
site really does build one, so the drift half derives a watch set and reds when
those sources move since `reviewed`. That is not friction to be removed: this
interval is the demonstration. The newer instrument REFUSES three of this
library's audited units, and had drift been silent the repository would have
carried three unauditable pieces with nothing anywhere saying so.

WHAT A JUDGEMENT OF THIS PIN LOOKS AT, and it is much narrower than the red. The
watch set is the package's path-dependency CLOSURE — `crates/admit`,
`crates/schem`, `crates/grammar`, `crates/orchestrator`, `crates/compiler`,
`crates/dsl` — because `delvewright-admit` links the whole pipeline in order to
serve its other subcommands. This gate builds that binary for ONE of them,
`delve-admit audit`, and that subcommand reads the palette allowlist and the
code-injection forbid out of `crates/schem`, the settling and spatial-contract
checkers out of `crates/grammar`, the footprint-class rule and the metrics table
it consults out of `crates/dsl`, and NOTHING out of `crates/compiler` — the
compiler is reached only from the `gallery` subcommand's Brigadier validation,
which this workflow never invokes. So a red naming commits that all landed in
`crates/compiler` is a correct statement about the closure and says nothing yet
about a verdict; the closure is deliberately not narrowed, because narrowing a
watch to dodge a red is the defect, and a wide watch that is understood costs
one reading. `crates/admit`'s OTHER subcommands reach further than `audit` does,
and `lighting` reaches furthest — `crate::light` names `delvewright_schem::nav`
and `delvewright_compiler::light`, neither on the audit path — so a judgement
asks which SUBCOMMAND a moved file is reached from: "the crate changed" and "the
gate changed" are different facts.

THE METHOD, which two corrections have shaped. Judges are built COLD, both of
them: `tools/worktree-new.sh` clones a donor's `target/` by default, and a judge
built on cloned artifacts does not hash-reproduce against one built from
scratch, so a reproduction claim taken from two clone-donor worktrees of one
donor is a claim about the donor. And the binaries' `DW` codes are read straight
out of the bytes (`grep -aoE 'DW[0-9]{4}'`), never with `strings`: the literals
live in a packed string table that `strings` splits between them, so it
under-reports and both binaries agree at the wrong number.

THIS INTERVAL, `968f7d87..8abcd1ac`, and the instrument really moved. Three
commits landed. `8c0485f7` reaches `crates/` not at all. `d95ecdd6` and
`8abcd1ac` move 14 source files ON the audit path — `crates/admit`'s `cli`,
`light`, `main` and `meta`, six of `crates/dsl`'s and four of
`crates/grammar`'s — plus 13 in `crates/compiler`. `crates/schem` and
`crates/orchestrator` are byte-identical. This is the shape the closure was NOT
going to produce most often: the tool itself changed.

MEASURED RATHER THAN ARGUED, and the measurement is why this pin is held.
Two judges from two `--no-clone` detached worktrees, cold, under the pinned
toolchain — `cargo 1.97.1` and `rustc 1.97.1` reported by each tree, each
build's exit asserted on its own line, 0 and 0. `tools/prefab-audit.py` with
each over the whole repository: 39 audited units over 39 in-scope `.nbt` files
under both, and there the two part company. The judge at `968f7d87` passes 39 of
39 at exit 0. The judge at `8abcd1ac` FAILS 3 of 39 at exit 1 —
`demos/gatehouse-elevations/gatehouse.nbt`,
`demos/guard-exhaustion/signal-station.nbt` and `demos/mill-race/mill-race.nbt`
— and moves those three report files' verdict from `pass` to `fail` and their
contract state from `undeclared` to `refused`. `DW0783` changes tier from
warning to error on exactly those three, and the new binary carries 23 `DW`
codes against 22, the addition being `DW0804`.

THE CAUSE, localised rather than guessed. `license.generated_by` gained a
required `region` field — `[x, y, z]`, the box the program was expanded over,
an independent input because the same program at the same seed over a different
box is a different building. The three refused documents are the only ones in
this repository that carry a `generated_by` block at all, which is why nothing
else moved: no `prefabs/*.json` declares one.

SO THE PIN IS HELD AT `968f7d87`, and this is the property it is held for: it is
the newest instrument every piece in this library can still be audited by.
`reviewed` names `8abcd1ac` because that history HAS been judged — the judgement
concluded that the library adopts first and the pin follows, not that nobody
looked.

THE ADOPTION ITEM the pin waits on, stated so it can be scheduled rather than
rediscovered: add `"region": [x, y, z]` to `license.generated_by` in
`demos/gatehouse-elevations/gatehouse.json`,
`demos/guard-exhaustion/signal-station.json` and
`demos/mill-race/mill-race.json`. The numbers are already in each file — its
`provenance` sentence states the region the program was expanded over — so the
edit adds no fact the document does not already assert; it moves one from prose
into the field a checker reads. When those three audit clean under a judge built
at the candidate revision, the pin moves with the reading that proves it.

WHAT WOULD END THE RE-READING, and it is not available in this repository. The
compiler-only case — a `crates/compiler` commit moving the watch closure while
reaching no rule this gate applies — costs a full interval reading every time
and never changes a verdict. Expressing "this pin moves deliberately and
upstream drift is not a finding" needs a policy value that does not exist:
`builds = []` is refused by name here, because the site really builds
`delvewright-admit` and silencing that guard would mean rewording the build
command, which is narrowing a watch to dodge a red. The vocabulary lives in
`tools/check-pins.py`, which this entry's own `vendors` key declares a verbatim
copy of the engine's — `tools/check-vendored.py` reds on a local edit — so the
line is written in the engine and arrives here as a re-vendor and a re-pin.
"""

[[pin]]
id = "engine-release"
value = "91a9a843d2ad2f0c3b852ea5fa4178567b68f875"
sites = ["versions.toml"]
repo = "stellarfeline/delvewright"
policy = "release"
judged_by = ".github/workflows/prefab-audit.yml"
why = """
The tagged engine release a delve image is built and validated with
(versions.toml [engine]). A released delve reproduces through its own pinned
engine and through nothing else, so this pin must never move for the sake of
newer behaviour — it moves only when a release deliberately adopts a newer
engine. `release` is checked, not asserted: the value must be a commit a
v<semver> tag points at, which a commit somebody merely stopped looking at
cannot be.
"""

[[pin]]
id = "engine-authoring"
value = "66906e395eb7517a8b5f7b104223877c4aa7e8ba"
sites = ["versions.toml"]
repo = "stellarfeline/delvewright"
policy = "track"
judged_by = ".github/workflows/prefab-audit.yml"
reviewed = "66906e395eb7517a8b5f7b104223877c4aa7e8ba"
builds = []
# `tools/check-skill-version.py` holds the skill page's frontmatter and prose to
# this engine, and two of the things it asks are questions the engine already
# answers in code: how the §2c idiom index table is parsed, and every prose
# phrasing that states its size. Those are copied rather than re-implemented,
# because a markdown parse rule re-written per gate is the private-copy defect
# CLAUDE.md names — and a copy is only worth more than a re-implementation while
# something proves it is still the same file, which is what `check-vendored.py`
# does with these two.
vendors = ["tools/check-stated-counts.py", "tools/lib/mdtable.py"]
why = """
The engine an AUTHOR builds their own toolchain from (versions.toml
`[engine].authoring_ref`) — the revision `/new-delve` Init step 2 checks out and
builds, and therefore the revision every picture, refusal and diagnostic in a
generation run comes from. Its reader is the skill page, which extracts it from
`versions.toml` and never restates it.

WHY IT IS NOT THE RELEASE PIN, since both name the same repository. `ref` answers
"which engine would ship this content", and a released delve reproduces through
that engine and nothing else, so it must never move for the sake of newer
behaviour. This answers "which engine does somebody author with", and it moves
whenever the authoring pipeline has been walked against a newer one. Pointing an
author at the release pin would hand them the newest RELEASED engine — months of
authoring fixes behind whatever the skill was last walked with — and pointing
them at neither is what was happening before this pin existed: the page told the
author to clone the engine and named no revision at all, so the toolchain moved
under them while they worked.

THE TERM, and it is `track`'s and not a new one. The value must be a commit the
engine's DEFAULT BRANCH carries. That is not an accident of the vocabulary
fitting; it is the property the pin actually needs. The reader of this pin is a
stranger with a clone and no other context, and their Init has to FETCH the
revision from the public remote. A commit reachable only from a topic branch can
be force-pushed away or deleted with the branch, and the author's fetch then
fails with `not our ref <sha>` before a single binary is built — a failure that
names a hash and no cause. The default branch is the one ref this project does
not rewrite, so "a commit the default branch carries" is exactly the demand that
makes the revision fetchable by anybody, indefinitely. The defect cannot supply
it: a sha somebody typed, truncated, or took from a local-only clone is not on
that branch, and neither is a revision whose branch was thrown away.

`release` WOULD BE THE WRONG TERM, not a stricter one. It demands a v<semver> tag
at the value, and an authoring engine is deliberately AHEAD of the newest
release — that lag is the thing this pin exists to remove. `immutable` and
`floating` are refused outright for a repository this project builds, and
correctly: a pin onto our own history is judged, or it is a published tag, and it
is not exempt by being renamed.

`builds` IS EMPTY, AND THE EMPTY WATCH IS THE DESIGN. The drift half of `track`
derives its watch set from the packages the SITE builds out of the pinned
checkout, and the site is `versions.toml`, which builds nothing. The alternative
is not a narrower watch but an absurd one: an author builds the whole engine
workspace, so a watch derived from what they build would be the entire `crates/`
tree and would red on every upstream commit forever. A gate that is always red is
one a reader learns to wave through, which is the opposite of a gate. So drift
from the default branch is deliberately NOT a finding for this pin, for the same
reason it is not one for `release`: what an author needs is the engine the
pipeline was WALKED against, not the newest one.

A JOB NOW BUILDS `delvec` OUT OF THIS REVISION AND `builds` STILL STAYS EMPTY.
`.github/workflows/campaign-build.yml` checks the engine out at this value and
builds the compiler to compile every unreleased campaign, which is the author's
own toolchain step performed in CI. That does not make it a site and does not
earn a watch set: the package it builds is the compiler, whose path-dependency
closure is the entire `crates/` tree, so a watch derived from it would red on
every upstream commit — the absurd watch above, arriving by another door. The
job takes the revision by READING `versions.toml` at run time and writes no
literal of its own, so the value still stands in exactly one file and the two
checkers below still hold it there. What that job asserts is unchanged by this
entry: an unreleased campaign compiles with the engine its author uses, and a
red there is an adoption item on the campaign.

WHAT WOULD MAKE IT STALE, then, and what would make staleness a finding. It is
stale when the engine has fixed an obstacle an author hits — a refusal with no
reachable remedy, a step that cannot be completed — and this pin still names the
tree without the fix; and equally when the skill gains a step written against a
newer engine while the pin stays behind, which is the same defect pointed the
other way. Neither is machine-detectable from this repository, and saying so is
the honest half: staleness here is established by WALKING `/new-delve` Init end
to end against a candidate revision, which is what produces a new `reviewed`, and
no job in this repository can perform that walk. `reviewed` and `value` name the
same revision because each was set by such a walk rather than inherited from an
older one. The walk that moved them to `66906e39` built the engine from source
at that revision from inside the clone, so its own `rust-toolchain.toml` pin
applied and `cargo` and `rustc` both answered `1.97.1`; `delvec --version` then
answered `1.1.0`, inside the skill's declared `requires.delvec` window; and the
run carried on through the page and authored a campaign against that toolchain
as far as the design gate. What that walk did NOT do is hold the gate, which is
the user's and had no user present. So this `reviewed` attests that Init
completes and that the authoring steps BEFORE the gate run at this engine, and
attests nothing about the steps after it.

WHAT ACTUALLY RUNS, because a pin whose only reader is prose is a doc line.
Seven readers, each catching a different bad edit, none of them able to
substitute for another:

  - `tools/check-pins.py` (offline, required job): the value is discovered in
    `versions.toml` and must carry an entry here; editing the pin without editing
    this file reds as an unregistered pin, and this entry keeping a value the file
    no longer holds reds as a registry that drifted from its site.
  - `.github/workflows/prefab-audit.yml` fetches the revision by sha into the
    pinned engine checkout, which is the author's own fetch performed in CI: a
    revision the remote will not serve fails there with `not our ref`, in the same
    words the author would have seen.
  - `tools/check-pins.py --online` (same job): a value naming no commit reds as
    "the pin names nothing", and a value the default branch does not carry reds by
    name. That is the term above, enforced.
  - `tools/check-authoring-pin.py` (same job): the value is a full 40-hex
    revision rather than a branch or tag name, the skill page really READS
    `authoring_ref`, and the revision string appears in no other tracked file.
    That last is not reachable from `check-pins.py` by design — markdown is prose
    to it, and is deliberately outside pin discovery — yet the skill page is
    executed by a person and is exactly where a second copy of the revision would
    be pasted.
  - `tools/check-skill-version.py` (same job): the first reader that uses the
    revision as an INSTRUMENT rather than judging the literal. It materialises
    the engine at this value and holds the skill page's `requires:` window,
    `verified_with`, every `delvec` subcommand and flag the page names, every
    campaign stage document the engine defines, and every number the page states
    about the idiom index, against that one engine. So this pin now decides a
    verdict: move it to an engine whose CLI has dropped a subcommand the page
    drives, and the page reds — which is the point, because that is exactly what
    an author would hit at Init step 2, and the alternative was finding out
    during their run.
  - `tools/check-vendored.py` (same job): the two files this entry declares in
    `vendors` are byte-identical to the engine's at this revision. They are the
    idiom-index oracle and the markdown-table parser the reader above imports —
    not maintained here, so an edit in place is a red rather than a fork.
  - `.github/workflows/campaign-build.yml` (the `every campaign builds` required
    job): the second reader that uses the revision as an INSTRUMENT. It checks
    the engine out here, builds `delvec`, and compiles every unreleased campaign
    with it — so this pin decides whether the campaigns a creator is still
    authoring are held to the engine that creator is using. A revision the remote
    will not serve fails there too, in the author's own words, before anything is
    built.
"""

[[pin]]
id = "actionlint-image"
value = "sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667"
sites = [".github/workflows/workflow-lint.yml"]
policy = "immutable"
why = """
The actionlint container the workflow lint runs, held by digest so the gate is
the same gate every time. Third-party bytes: its currency is a supply-chain
question with a different owner, and this gate does not pretend to answer it.
"""

