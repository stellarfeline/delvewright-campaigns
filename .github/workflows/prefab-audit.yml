name: prefab palette audit

# spec-0007 community contract: a new prefab ships in the same PR as the campaign
# that needs it, and "the NBT palette audit gates the prefab half in CI". This is
# that gate for the content repo.
#
# The check itself is `tools/prefab-audit.py` and NOT this file. A gate whose
# logic lives in workflow YAML is a gate only the runner can run, and the
# toolchain is for creators: everything an author needs to validate has to be
# runnable on the author's own machine. So this workflow does exactly two things
# a runner is needed for — check out the pinned tool and build it — and then
# calls the same script an author calls:
#
#     python3 tools/prefab-audit.py --bin <path to delve-admit>
#
# The script walks this repository and audits every `.nbt` git will carry — the
# roots are discovered, printed, and never configured. What an AUDITED UNIT is
# is documented there too: a zone past the 48-per-axis template cap ships
# several `.nbt` plus one `structure_set` manifest and no single `.nbt`, so for
# that zone the manifest is the unit and `delve-admit` refuses a per-tile
# verdict (DW0739).
#
# There is deliberately NO `paths:` filter, and that is the same rule one layer
# out. A paths filter is a hand-maintained list of the directories a piece can
# enter through, which is exactly the shape the script stopped relying on: a
# `.nbt` committed somewhere the list does not name would leave the gate green
# by never running it at all. It is cheap to leave off — the pinned tool build
# is cached on `ADMIT_REF`, and auditing forty units takes seconds.
#
# The audit tool (`delve-admit`) is GPL pipeline code and lives in the pipeline
# repo (delvewright). It is built from a PINNED SHA so the allowlist the audit
# enforces is reproducible, and bumping the pin is a deliberate, reviewed change
# — the rules a piece is held to are the ones that commit carries, and a moving
# ref would let them change underneath the library with nothing to review.
#
# The pin is a claim about the GAME as much as about the tool. The allowlist is
# a set of block ids at the pinned Minecraft version, and a builder writes the
# spelling that version has. So a pin that trails the game refuses live ids
# (DW0730) while holding dead ones in their place — an id the game no longer
# knows loads as air, which is a hole in a building rather than a failure. The
# pin holds the rules still; it does not hold them behind. It moves forward
# whenever the ids it names stop being the ids the delve runs on, and the value
# below is the one whose ids are.
#
# The pin is also a claim about WHICH DOORS OPEN, and that is the floor any
# later bump holds. `delve-admit audit` has a second door — the spatial
# contract — and a door can only open on a document the engine can read. An
# engine that cannot open a tile-set MANIFEST audits a tiled zone on its
# palette alone: nothing about that zone's spaces, its out-of-walk regions or
# the way a body moves through it is judged, and nothing says so. That is a
# green over zero obligations, and it reads exactly like a green over
# thousands. Measured on this repository, an engine below the floor ran the
# contract over 0 of the 7 tiled zones here and printed no binding count for
# any of them; the revision named below opens on all 7 — 276 declared objects,
# 80 772 objects examined — and where a piece carries no contract at all it
# says so by name (`DW0783`) rather than staying silent. A pin is chosen for
# what it can JUDGE, never for what it makes green.
#
# Credential note, RESOLVED. This step used to carry a cross-repo PAT
# (`secrets.MAIN_REPO_TOKEN`) because `delvewright` was private, and the note
# recorded its own exit condition: "once the main repo is public the token can
# be dropped and the default GITHUB_TOKEN will suffice, which also unlocks
# community fork PRs." Both repos are public, so the token is gone.
#
# That was not cosmetic. GitHub withholds secrets from fork-based PRs, so for as
# long as the PAT was required this gate could not check out its own tool on a
# fork PR — the community contribution path spec-0007 exists to protect was the
# one path the gate did not cover. Dropping the token is what binds it.

on:
  pull_request:
  # A pull request is not the only way a piece arrives — a commit pushed
  # straight to a branch is the other one, and `zone-audit.yml` here already
  # covers both for the same reason.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned pipeline-repo SHA the audit tool is built from (see header).
  ADMIT_REF: 5e0ad7fd46d3855796e1963ad2eb54269ec76622

jobs:
  audit:
    name: NBT palette audit (allowlist + code-injection forbid)
    runs-on: ubuntu-latest
    steps:
      # This repo — with git-lfs so the .nbt prefabs materialize (they are LFS
      # pointers otherwise and the audit would fail to parse them). Full history
      # is not needed, but the checkout must be a git checkout: the script asks
      # git which `.nbt` the repository actually carries, and cross-checks that
      # answer against its own walk of the tree.
      - name: check out content repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The audit tool's source, pinned. Public repo -> the default GITHUB_TOKEN
      # reaches it, and a fork PR gets the same checkout the owner's PRs do.
      #
      # `actions/checkout` can only write inside the workspace, so `admit-src/`
      # lands inside the tree the script walks. It is a different repository and
      # is not audited — and what excludes it is the only thing that excludes
      # anything here: this repository's git does not track it and would not add
      # it. No directory name is written down anywhere to achieve that. If the
      # pinned pipeline tree ever carries a `.nbt`, the run prints it by name as
      # not audited, with that reason.
      - name: check out delve-admit source (pipeline repo, pinned)
        uses: actions/checkout@v4
        with:
          repository: stellarfeline/delvewright
          ref: ${{ env.ADMIT_REF }}
          path: admit-src

      # Cache cargo + build artifacts, keyed on the pinned SHA and the admit
      # crate's lockfile so a pin bump busts the cache cleanly.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admit-src
          key: admit-${{ env.ADMIT_REF }}

      # Build only the admit crate (+ its path deps schem/orchestrator), not the
      # whole workspace — keeps the gate cheap.
      - name: build delve-admit
        working-directory: admit-src
        run: cargo build -p delvewright-admit --bin delve-admit --release

      # One audited unit at a time, with the binding count printed: which roots
      # the walk discovered, how many single-file prefabs and how many tiled
      # zones were examined in each, how many tiles those zones covered, and how
      # many `.nbt` files the walk found in total. A run that examines zero units
      # fails.
      - name: audit every `.nbt` in the repository
        run: |
          python3 tools/prefab-audit.py \
            --bin admit-src/target/release/delve-admit \
            --reports "${RUNNER_TEMP}/prefab-audit-reports" \
            --github

      - name: upload the audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefab-audit-reports
          path: ${{ runner.temp }}/prefab-audit-reports
          if-no-files-found: warn
