name: prefab palette audit

# spec-0007 community contract: a new prefab ships in the same PR as the campaign
# that needs it, and "the NBT palette audit gates the prefab half in CI". This is
# that gate for the content repo.
#
# The audit tool (`delve-admit`) is GPL pipeline code and lives in the *main*
# repo (delvewright). We build it from a PINNED main SHA so the allowlist the
# audit enforces is reproducible: a309f61 is the first main commit whose
# broadened allowlist (PR #56) admits every prefab merged into this repo
# (content PR #6). Bumping the pin is a deliberate, reviewed change.
#
# Credential note, RESOLVED. This step used to carry a cross-repo PAT
# (`secrets.MAIN_REPO_TOKEN`) because `delvewright` was private, and the note
# recorded its own exit condition: "once the main repo is public the token can
# be dropped and the default GITHUB_TOKEN will suffice, which also unlocks
# community fork PRs." Both repos are public, so the token is gone.
#
# That was not cosmetic. GitHub withholds secrets from fork-based PRs, so for as
# long as the PAT was required this gate could not check out its own tool on a
# fork PR — the community contribution path spec-0007 exists to protect was the
# one path the gate did not cover. Dropping the token is what binds it.

on:
  pull_request:
    paths:
      - "prefabs/**"
      - "catalog/**"
      # A demo level ships a piece of its own, and a piece nothing audits is a
      # piece that entered the repo through the one door with no gate on it.
      - "demos/**"
  # On demand: the paths filter above means a change to this workflow itself
  # never exercises it, so a change to the gate could otherwise only be proved
  # by a later unrelated prefab PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned main-repo SHA the audit tool is built from (see header).
  ADMIT_REF: a309f61e2ab75d0f8cd2759e02eb7703e048e072

jobs:
  audit:
    name: NBT palette audit (allowlist + code-injection forbid)
    runs-on: ubuntu-latest
    steps:
      # This repo — with git-lfs so the .nbt prefabs materialize (they are LFS
      # pointers otherwise and the audit would fail to parse them).
      - name: check out content repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The audit tool's source, pinned. Public repo -> the default GITHUB_TOKEN
      # reaches it, and a fork PR gets the same checkout the owner's PRs do.
      - name: check out delve-admit source (main repo, pinned)
        uses: actions/checkout@v4
        with:
          repository: stellarfeline/delvewright
          ref: ${{ env.ADMIT_REF }}
          path: admit-src

      # Cache cargo + build artifacts, keyed on the pinned SHA and the admit
      # crate's lockfile so a pin bump busts the cache cleanly.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admit-src
          key: admit-${{ env.ADMIT_REF }}

      # Build only the admit crate (+ its path deps schem/orchestrator), not the
      # whole workspace — keeps the gate cheap.
      - name: build delve-admit
        working-directory: admit-src
        run: cargo build -p delvewright-admit --bin delve-admit --release

      - name: audit every prefab .nbt
        run: |
          BIN="admit-src/target/release/delve-admit"
          shopt -s nullglob
          # Every place a piece can enter this repo, enumerated. A glob that only
          # looks where somebody pointed is how an unaudited piece survives review.
          library=(prefabs/*.nbt)
          demo=(demos/*/*.nbt)
          nbts=("${library[@]}" "${demo[@]}")
          if [ ${#library[@]} -eq 0 ]; then
            echo "::error::no prefab .nbt found under prefabs/ — is git-lfs materialized?"
            exit 1
          fi
          fail=0
          for f in "${nbts[@]}"; do
            echo "--- auditing $f ---"
            # Report to stdout as the machine-readable record; diagnostics go to
            # stderr. Non-zero exit = a forbidden or not-allowlisted block.
            if ! "$BIN" audit "$f" -o "/tmp/$(basename "$f").report.json"; then
              echo "::error file=$f::palette audit failed (forbidden or not-allowlisted block)"
              fail=1
            fi
          done
          echo "audited ${#nbts[@]} piece(s): ${#library[@]} library, ${#demo[@]} demo"
          exit $fail
