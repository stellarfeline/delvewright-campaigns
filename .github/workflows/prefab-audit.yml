name: prefab palette audit

# spec-0007 community contract: a new prefab ships in the same PR as the campaign
# that needs it, and "the NBT palette audit gates the prefab half in CI". This is
# that gate for the content repo.
#
# The check itself is `tools/prefab-audit.py` and NOT this file. A gate whose
# logic lives in workflow YAML is a gate only the runner can run, and the
# toolchain is for creators: everything an author needs to validate has to be
# runnable on the author's own machine. So this workflow does exactly two things
# a runner is needed for — check out the pinned tool and build it — and then
# calls the same script an author calls:
#
#     python3 tools/prefab-audit.py --bin <path to delve-admit>
#
# What an AUDITED UNIT is, and why it is not a glob over `prefabs/*.nbt`, is
# documented in that script. In short: a zone past the 48-per-axis template cap
# ships several `.nbt` plus one `structure_set` manifest and no single `.nbt`,
# so for that zone the manifest is the unit and `delve-admit` refuses a per-tile
# verdict (DW0739). A glob reaches the tiles and never the manifest, which is
# the one file that describes the zone.
#
# The audit tool (`delve-admit`) is GPL pipeline code and lives in the pipeline
# repo (delvewright). It is built from a PINNED SHA so the allowlist the audit
# enforces is reproducible, and bumping the pin is a deliberate, reviewed change
# — the rules a piece is held to are the ones that commit carries, and a moving
# ref would let them change underneath the library with nothing to review.
#
# Credential note, RESOLVED. This step used to carry a cross-repo PAT
# (`secrets.MAIN_REPO_TOKEN`) because `delvewright` was private, and the note
# recorded its own exit condition: "once the main repo is public the token can
# be dropped and the default GITHUB_TOKEN will suffice, which also unlocks
# community fork PRs." Both repos are public, so the token is gone.
#
# That was not cosmetic. GitHub withholds secrets from fork-based PRs, so for as
# long as the PAT was required this gate could not check out its own tool on a
# fork PR — the community contribution path spec-0007 exists to protect was the
# one path the gate did not cover. Dropping the token is what binds it.

on:
  pull_request:
    paths:
      - "prefabs/**"
      - "catalog/**"
      # The check is a script now, so a change to the script is a change to the
      # gate and must exercise it. Same for this file: a paths filter that does
      # not name the gate's own sources is a gate that cannot be tested by the
      # PR that changes it.
      - "tools/**"
      - ".github/workflows/prefab-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned pipeline-repo SHA the audit tool is built from (see header).
  ADMIT_REF: c0b12206f9b7e07f149a41e76ac638fd9efc5d1e

jobs:
  audit:
    name: NBT palette audit (allowlist + code-injection forbid)
    runs-on: ubuntu-latest
    steps:
      # This repo — with git-lfs so the .nbt prefabs materialize (they are LFS
      # pointers otherwise and the audit would fail to parse them).
      - name: check out content repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The audit tool's source, pinned. Public repo -> the default GITHUB_TOKEN
      # reaches it, and a fork PR gets the same checkout the owner's PRs do.
      - name: check out delve-admit source (pipeline repo, pinned)
        uses: actions/checkout@v4
        with:
          repository: stellarfeline/delvewright
          ref: ${{ env.ADMIT_REF }}
          path: admit-src

      # Cache cargo + build artifacts, keyed on the pinned SHA and the admit
      # crate's lockfile so a pin bump busts the cache cleanly.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admit-src
          key: admit-${{ env.ADMIT_REF }}

      # Build only the admit crate (+ its path deps schem/orchestrator), not the
      # whole workspace — keeps the gate cheap.
      - name: build delve-admit
        working-directory: admit-src
        run: cargo build -p delvewright-admit --bin delve-admit --release

      # One audited unit at a time, with the binding count printed: how many
      # single-file prefabs and how many tiled zones were examined, and how many
      # tiles those zones covered. A run that examines zero units fails.
      - name: audit every prefab and every tiled zone
        run: |
          python3 tools/prefab-audit.py \
            --bin admit-src/target/release/delve-admit \
            --reports "${RUNNER_TEMP}/prefab-audit-reports" \
            --github

      - name: upload the audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefab-audit-reports
          path: ${{ runner.temp }}/prefab-audit-reports
          if-no-files-found: warn
