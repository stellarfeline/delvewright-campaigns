name: prefab palette audit

# spec-0007 community contract: a new prefab ships in the same PR as the campaign
# that needs it, and "the NBT palette audit gates the prefab half in CI". This is
# that gate for the content repo.
#
# The audit tool (`delve-admit`) is GPL pipeline code and lives in the *main*
# repo (delvewright). It is built from a PINNED main SHA so that the rules a
# piece is held to are the ones one reviewed commit carries, and a moving ref
# cannot change them underneath the library. Bumping the pin is a deliberate,
# reviewed change — and, because a pin nobody looks at is invisible, the pin is
# registered in `.github/pins.toml` and judged by `tools/check-pins.py` in this
# same job, immediately before the tool is built from it.
#
# THE AUDIT'S UNIT IS A PIECE, NOT A FILE. A zone past the structure-template cap
# ships as several `.nbt` tiles under one `.json` manifest, and both settling
# rules read a cell's neighbours — so judging a tile alone reports every channel
# and stair run that crosses a tile seam as broken, and the tool refuses a lone
# tile by name rather than answering about it. `tools/prefab-audit.py` is the
# whole of that check: it walks the tree, closes its accounting over git's index,
# and audits a tile set through its manifest and a standalone piece on its own.
#
# Credential note, RESOLVED. This step used to carry a cross-repo PAT
# (`secrets.MAIN_REPO_TOKEN`) because `delvewright` was private, and the note
# recorded its own exit condition: "once the main repo is public the token can
# be dropped and the default GITHUB_TOKEN will suffice, which also unlocks
# community fork PRs." Both repos are public, so the token is gone.
#
# That was not cosmetic. GitHub withholds secrets from fork-based PRs, so for as
# long as the PAT was required this gate could not check out its own tool on a
# fork PR — the community contribution path spec-0007 exists to protect was the
# one path the gate did not cover. Dropping the token is what binds it.

on:
  # NO PATH FILTER, deliberately, and the reason is a live deadlock this file
  # used to cause. This job's name is a REQUIRED status check on the default
  # branch, and branch protection matches a context by NAME: a pull request
  # whose files matched none of the filters produced no run, so the required
  # context never reported and the pull request was blocked FOREVER — including
  # the pull request that would have fixed it. Measured: a campaign-only change
  # showed zero checks and a blocked merge state, while a piece-touching one
  # merged normally.
  #
  # The earlier repair added the gate's OWN inputs to the filter, because a
  # change that moved the pinned instrument or rewrote this workflow used to
  # decide every future audit while running none — "the required check was
  # satisfied by never reporting", which is how a pin sat four hundred commits
  # behind with nothing red. That was correct and did not go far enough: it
  # fixed the cases where the gate judged the wrong thing, not the case where it
  # judged nothing and the answer was mistaken for a verdict.
  #
  # A filter is the wrong instrument for the saving anyway. The audit's own
  # driver walks the tree and closes its accounting over git's index, and it
  # STATES ITS BINDING COUNT — so on a change that touches no piece it reports,
  # honestly, how many it examined. A zero binding stated out loud is a fact a
  # reviewer can act on; a check that never ran is a silence branch protection
  # cannot distinguish from a pass.
  pull_request:
  # On demand: proves a change to the gate before a later unrelated prefab PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned main-repo SHA the audit tool is built from. The registry entry
  # `admit-ref` in `.github/pins.toml` is where its policy lives, and
  # `tools/check-pins.py` is what holds it to that policy — a comment here
  # cannot, because nothing reads a comment.
  ADMIT_REF: 46abe8bf21921e5a48c0b477da707bae0b8e9b7c

jobs:
  audit:
    name: NBT palette audit (allowlist + code-injection forbid)
    runs-on: ubuntu-latest
    steps:
      # This repo — with git-lfs so the .nbt prefabs materialize (they are LFS
      # pointers otherwise and the audit would fail to parse them).
      - name: check out content repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The pin gate's own guards, run BEFORE it, in this job rather than in one
      # of their own. A separate job would need a new required status check, and
      # this repository has already shipped the deadlock that creates: branch
      # protection matches a context by NAME, so a required name no run ever
      # reports blocks every pull request forever, including the one that would
      # fix it. Riding the existing job costs no new name and cannot be skipped —
      # the gate below is unreachable without it.
      #
      # `unittest`, not a framework, and no install step: the checker is
      # stdlib-only so that it runs on a creator's own clone with nothing
      # installed, and a guard that needed more than the thing it guards would
      # not run there.
      #
      # What they hold it to is the narrowing: a COMMAND (`docker run`, `git
      # clone`) reads the same in every language, while a DIRECTIVE (`uses:`, a
      # Dockerfile `FROM`, a Cargo `git =`) is prose outside its own. Both halves
      # are asserted, because a narrowing that cannot tell a campaign document
      # which really shells out from a diagnostic transcript whose all-caps
      # emphasis wraps onto a line beginning `FROM` is an exemption.
      - name: the pin gate's guards
        run: python3 -m unittest discover -s tools/tests -t tools/tests

      # Every pin in THIS repo is declared, and every declaration still matches
      # the file it claims to describe. Offline, stdlib-only, so it runs here and
      # on a creator's own clone with nothing installed. It states its binding
      # count; a binding of zero is a finding, not a pass.
      - name: every pin is declared
        run: python3 tools/check-pins.py

      # The audit tool's source, pinned. Public repo -> the default GITHUB_TOKEN
      # reaches it, and a fork PR gets the same checkout the owner's PRs do.
      #
      # Full depth, because the next step asks what landed after this pin and a
      # shallow clone cannot answer it. The question is text-only.
      - name: check out delve-admit source (main repo, pinned)
        uses: actions/checkout@v4
        with:
          repository: stellarfeline/delvewright
          ref: ${{ env.ADMIT_REF }}
          path: admit-src
          fetch-depth: 0

      - name: fetch the pipeline's default branch so the pin has something to be behind
        run: |
          git -C admit-src fetch origin main:refs/remotes/origin/main

      # `tools/check-pins.py` is not maintained here. It is ONE tool with two
      # copies — the pipeline's is the source, this one is a verbatim vendored
      # copy — and this step is what makes that sentence checkable rather than
      # aspirational. It runs BEFORE the pinned tool is trusted below, and before
      # anything is built out of the checkout.
      #
      # The two copies once differed by a single constant naming directories to
      # skip. In the pipeline repository every name in it matched zero tracked
      # files, so the entry was inert and correct where it was written; carried
      # here, where `campaigns/` IS the content, it removed 27 tracked files —
      # every campaign stage document — from both pin discovery and the fetch-
      # verb enumeration. Nothing was red and nothing could have been: the counts
      # were truthful about what they were handed, and a file the enumeration
      # never lists cannot be reported as unexamined.
      #
      # It is a SEPARATE script, not a mode of `check-pins.py`, and that is the
      # load-bearing choice. `check-pins.py` ignores registry keys it does not
      # know — measured, not assumed — so a vendor check living inside it would
      # disappear the moment an older copy was vendored, which is precisely when
      # the copies have drifted. The check would supply its own exemption. This
      # script is never vendored, so nothing that can go wrong with a vendored
      # file can stop it running.
      #
      # It states its binding count WITH ITS DENOMINATOR — how many vendored
      # files compared, against how many tracked files here and how many in the
      # pinned tree — because a truthful count over a truncated input is exactly
      # what went wrong last time. A binding of zero is a finding.
      - name: a vendored file is the upstream file, byte for byte
        run: |
          python3 tools/check-vendored.py \
            --checkout admit-ref=admit-src

      # The pin is judged HERE, in the job that uses it, immediately before the
      # tool is built out of it. There is no arrangement in which this job builds
      # from the pin and skips its own next step, which is what a gate bound to a
      # doc line could never say. A pin held on purpose passes and says on what
      # terms; a pin nobody has looked at since its sources moved is a red.
      - name: the pinned instrument is measured against what it names
        run: |
          python3 tools/check-pins.py --online \
            --checkout admit-ref=admit-src \
            --checkout engine-release=admit-src

      # Cache cargo + build artifacts, keyed on the pinned SHA and the admit
      # crate's lockfile so a pin bump busts the cache cleanly.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admit-src
          key: admit-${{ env.ADMIT_REF }}

      # Build only the admit crate (+ its path deps schem/orchestrator), not the
      # whole workspace — keeps the gate cheap.
      - name: build delve-admit
        working-directory: admit-src
        run: cargo build -p delvewright-admit --bin delve-admit --release

      # One audited unit at a time, with the binding count printed: which roots
      # the walk discovered, how many single-file prefabs and how many tiled
      # zones were examined in each, how many tiles those zones covered, and how
      # many `.nbt` files the walk found in total. A run that examines zero units
      # fails.
      #
      # The whole of the check lives in the script, not in this YAML, so a
      # creator runs exactly what CI runs with one command and no workflow
      # runner. The audited set is a WALK of the tree closed over git's index,
      # never a glob over roots somebody listed — a glob only ever looks where it
      # was pointed, and the first piece committed somewhere nobody anticipated
      # enters through the one door with no gate on it.
      - name: audit every `.nbt` in the repository
        run: |
          python3 tools/prefab-audit.py \
            --bin admit-src/target/release/delve-admit \
            --reports "${RUNNER_TEMP}/prefab-audit-reports" \
            --github

      - name: upload the audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefab-audit-reports
          path: ${{ runner.temp }}/prefab-audit-reports
          if-no-files-found: warn
