name: zone program audit

# A campaign's zone programs — `campaigns/<campaign>/design/programs/*.json` —
# are the artifact of record for the geometry a zone's prefab is expanded from
# (ADR-0018: the IR is the artifact). Nothing in this repo ever read one. The
# prefab audit's paths filter is `prefabs/**` and `catalog/**` and its glob is
# `prefabs/*.nbt`; the release workflow only runs at tag time, after the content
# is already on the branch. So a zone program could be written, pushed and merged
# with no job of any kind executing against it, and one was: nine machine gates
# were written over Z2 in a scratch directory, read 1 of 9 on the unmodified
# program with five at zero binding, and then stopped running because nothing
# invoked them. That is the fourth vacuity mode — a gate nothing invokes is not a
# gate, it is unrun — and this workflow is the invocation.
#
# NO PATHS FILTER, deliberately. A filter is an enumeration of where somebody
# expected the change to land, and a gate that only looks where it was pointed is
# how this shape survives review: renaming `design/programs/` would silently take
# every zone out of the audit's reach. This job runs on every pull request and on
# every push, and discovers campaigns rather than listing them.
#
# The engine half of the same binding lives in the pipeline repo's `campaign
# builds` job, which runs the identical command against the PINNED content SHA.
# That one cannot see a change until the next re-pin, which is why this exists
# too: this job is what makes an edit on THIS branch answerable now.

on:
  pull_request:
  push:
  # A change to this workflow can otherwise only be proved by a later PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned pipeline-repo SHA the audit tool and its exclusions record are built
  # from. Bumping it is a deliberate, reviewed change — the gates a zone is held
  # to are the ones this commit carries, and a moving ref would let them change
  # underneath a campaign with nothing to review.
  #
  # The pin is a commit on the pipeline repo's `main`. Bumping it replaces the
  # value below; no machinery in this repository moves with it.
  #
  # It is chosen for what the engine at it can READ and for what it can JUDGE,
  # never for what it makes green. Two floors any later bump holds:
  #
  # Document version. Every zone program here declares `1.4.0`, and a whole-map
  # program that composes them declares `1.5.0` — the `include` list, which
  # names another program file and the prefix its vocabulary arrives under. A
  # `Program` schema without that field refuses a composed document at parse, by
  # field name, before any gate runs; so an engine that cannot read `1.5.0` is
  # not a stricter judge of the map, it is no judge of it at all.
  #
  # One authority on a zero binding. A gate that examined nothing has proved
  # nothing, so it fails — and the rule lives in one function that every door
  # calls, so the `expand` that writes a prefab and the audit that judges the
  # same program cannot reach opposite verdicts about it. A binding of zero is
  # an honest answer only where the gate itself computes that there was nothing
  # of its kind to examine; that fact is derived from the expansion and no
  # author can write it into a program. An engine below this floor carries a
  # second, contradicting rule in the audit's own red filter, and passes through
  # one door a building it refuses at the other.
  GRAMMAR_REF: 50b9aacc3e60f419244cd6b049027f8bae41337f

jobs:
  zones:
    name: zone programs (expand + judge every gate)
    runs-on: ubuntu-latest
    steps:
      # Text only. A zone program is JSON and the expander needs no prefab
      # bodies, so LFS stays off and the checkout is a few hundred KB.
      - name: check out content repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: check out delve-grammar source (pipeline repo, pinned)
        uses: actions/checkout@v4
        with:
          repository: stellarfeline/delvewright
          ref: ${{ env.GRAMMAR_REF }}
          path: grammar-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: grammar-src
          key: grammar-${{ env.GRAMMAR_REF }}

      - name: build delve-grammar
        working-directory: grammar-src
        run: cargo build -p delvewright-grammar --bin delve-grammar --release

      # `--campaign-root .` is this repo's own root: the tool looks for
      # `campaigns/<campaign>/design/programs/`. It reds if it finds no programs
      # at all, if a programs directory carries no `zones.json` manifest, if a
      # program file no manifest entry names is sitting there, if any gate fails,
      # or if any gate examined zero objects. Every run prints a binding count
      # per gate.
      #
      # `--library` audits the pinned engine's own rule vocabulary in the same
      # call, and it is the corpus pairing the exclusions record is written for.
      # That record INVERTS an assertion rather than removing one: a recorded
      # program is still expanded and still judged, and it is a finding if it
      # passes, if it fails with a different code, or if it fails with one more.
      # Its ids are audit labels — `library/<program>` as well as
      # `<campaign>/<zone>` — so a call that walks only one corpus holds the
      # other corpus's records to nothing, and the audit reds by name rather
      # than letting an inversion go unexercised (`RECORD STALE`). Both corpora
      # in one call is also what the pipeline repo's own CI runs, which is what
      # keeps one record answerable from either repo.
      - name: every zone program expands and judges green
        run: |
          grammar-src/target/release/delve-grammar audit \
            --library \
            --campaign-root . \
            --exclusions grammar-src/.github/zone-audit-exclusions.json
