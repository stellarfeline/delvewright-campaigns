name: campaign build

# Every campaign in this repo compiles, on every push and every pull request.
#
# Why this exists. The other workflows here are `prefab-audit.yml` (path-filtered
# to `prefabs/**` / `catalog/**`), `release.yml` (tag-only) and `workflow-lint.yml`
# (path-filtered to `.github/workflows/**`), so a push that touched nothing but
# `campaigns/**` reported ZERO checks, and the only thing that ever compiled a
# campaign was a release tag. A campaign sat un-buildable on `main` for days as a
# result: the engine grew `DW0331` (dialogue option labels wider than the button
# vanilla draws them on) and `DW0205` (a dialogue button that lets the party skip
# a load-bearing beat) after the campaign was authored, and nothing anywhere went
# red, because nothing anywhere built it. The engine repo does not close this
# either: its CI compiles only its own `crates/dsl/fixtures/**` campaigns, never
# a real one.
#
# What this gate is, and is not. The STATIC ladder — `delvec validate` (schema +
# referential + text fit + l10n sidecars) and `delvec build` (placement,
# reachability, emission) — per campaign, per push, in every language the
# campaign declares. The RUNTIME ladder (PackTest, the bot playthrough, the
# multi-arch image) stays where it is: `release.yml`, on a release tag. That is
# the tiered-testing split applied to the repo where campaigns actually live.
#
# Which engine. `versions.toml` `[engine].ref` — the same pin `release.yml`
# builds a release with, so "green here" means "this campaign compiles with the
# engine that would ship it", and the answer is reproducible from two commit ids
# (ADR-0006). Deliberately NOT the engine repo's `main`: this repo must not go
# red for a change that has not been pinned yet. Re-pinning the engine is the
# moment new compiler obligations arrive, and that pull request is where a
# campaign's adoption round is scheduled — which is exactly what this gate makes
# visible.
#
# Credentials. Both repos are public, so the cross-repo checkout needs no
# credential of its own; the default GITHUB_TOKEN reaches the engine repo, same
# as `prefab-audit.yml`. That is not cosmetic: GitHub withholds secrets from
# fork-based pull requests, so a cross-repo PAT here would leave the community
# contribution path as the one path this gate did not cover.

on:
  # NO PATH FILTER, and the reason is the one `prefab-audit.yml` records beside
  # its own dropped filter. `every campaign builds` below is a REQUIRED status
  # check, and branch protection matches a context by its NAME STRING: a pull
  # request whose files matched none of the filters produces no run, the context
  # never reports, and the merge blocks forever — including the pull request that
  # would fix it. This repository has already shipped that deadlock once.
  #
  # A filter is the wrong instrument for the saving anyway. The `discover` job
  # states its binding count and names what it excluded, so a change touching no
  # campaign gets an honest "2 campaigns, 0 excluded" rather than a silence that
  # protection cannot tell from a pass. What the filter bought is measured rather
  # than guessed: the two build legs are the whole cost, they run concurrently,
  # and the cargo cache is keyed on the engine pin, so a run that changes nothing
  # about the engine reuses it.
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which campaigns exist, as a matrix. A campaign directory is one holding a
  # `world.json`, and `release.yml` says the same thing in its own words:
  # "`campaigns/<id>/` is not proof of a campaign" — it has already met a
  # directory here that carried media and build output and no stage documents at
  # all. So the rule is the entry DOCUMENT, never the directory, and the two
  # cannot disagree about what a campaign is.
  #
  # Which makes the rule an EXCLUSION, and an exclusion nobody counts is how a
  # count stays honest about a smaller world than the tool claims to cover. This
  # repository has paid for that exact shape once: a constant naming directories
  # to skip removed 27 tracked files — every campaign stage document — from a
  # tool's enumeration while every stated number remained truthful about what it
  # had been handed. A campaign whose `world.json` is renamed, moved or lost
  # would drop out of this matrix the same way, and the binding count would go on
  # reading as a pass. So the discovery states what it EXCLUDED as well as what
  # it found, and refuses on the one exclusion that cannot be innocent.
  discover:
    name: discover campaigns
    runs-on: ubuntu-latest
    outputs:
      campaigns: ${{ steps.list.outputs.campaigns }}
      count: ${{ steps.list.outputs.count }}
      excluded: ${{ steps.list.outputs.excluded }}
      headless: ${{ steps.list.outputs.headless }}
    steps:
      # Text only — no LFS. The prefab bodies are not read here.
      - uses: actions/checkout@v4

      - name: list campaign directories
        id: list
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, sys

          # Every document a campaign is authored out of. A directory carrying
          # one of these is a campaign whatever else is true of it.
          STAGE = ("world.json", "quest-plan.json", "quests.json", "npcs.json",
                   "classes.json", "dialogue.json", "world-edits.json")

          root = pathlib.Path("campaigns")
          ids, media, headless = [], [], []
          for p in sorted(root.iterdir()):
              if not p.is_dir():
                  continue
              if (p / "world.json").is_file():
                  ids.append(p.name)
                  continue
              # Excluded. Which kind is decided by the OBJECT, not by whoever
              # wrote the directory: one carrying no stage document at all is
              # media or build output and is nothing this gate can build; one
              # carrying any OTHER stage document is a campaign that has lost
              # its entry document, and silently dropping it is the defect.
              others = [s for s in STAGE if (p / s).is_file()]
              (headless if others else media).append(
                  {"dir": p.name, "carries": others})

          print("campaigns=" + json.dumps(ids))
          print("count=" + str(len(ids)))
          print("excluded=" + json.dumps(media + headless))
          print("headless=" + json.dumps(headless))
          print(f"discovered {len(ids)} campaign(s): {', '.join(ids) or '(none)'}",
                file=sys.stderr)
          PY

      # A gate that binds to nothing is vacuous, not a pass — and a gate that
      # binds to FEWER than the tree holds is the same defect with a plausible
      # number on it. Both are stated here, in the step whose stdout is not
      # redirected into `$GITHUB_OUTPUT`, so a workflow command is a workflow
      # command rather than a line in an outputs file.
      - name: the matrix binds to every campaign, and every exclusion is counted
        env:
          COUNT: ${{ steps.list.outputs.count }}
          CAMPAIGNS: ${{ steps.list.outputs.campaigns }}
          EXCLUDED: ${{ steps.list.outputs.excluded }}
          HEADLESS: ${{ steps.list.outputs.headless }}
        run: |
          set -euo pipefail
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no campaign directory found under campaigns/ (a campaign is a directory holding world.json) — this gate would pass vacuously"
            exit 1
          fi
          echo "campaign build gate binds to $COUNT campaign(s): ${CAMPAIGNS}"
          echo "excluded from the matrix: ${EXCLUDED}"
          python3 - <<'PY'
          import json, os, sys
          headless = json.loads(os.environ["HEADLESS"])
          for h in headless:
              print(f"::error::campaigns/{h['dir']} carries "
                    f"{', '.join(h['carries'])} but no world.json, so it is a "
                    f"campaign the matrix would drop while still reporting a "
                    f"binding count — an honest number about a smaller world "
                    f"than this gate claims to cover")
          sys.exit(1 if headless else 0)
          PY

  build:
    name: build ${{ matrix.campaign }} (validate + analyze + emit)
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One red campaign must not hide the state of the others.
      fail-fast: false
      matrix:
        campaign: ${{ fromJson(needs.discover.outputs.campaigns) }}
    steps:
      # With LFS: `delvec build` copies the prefab `.nbt` bodies into the
      # datapack, and an LFS pointer is not an NBT file.
      - name: check out content repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: read the pinned engine from versions.toml
        id: engine
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          e = tomllib.load(open("versions.toml", "rb"))["engine"]
          print(f"repo={e['repo']}")
          print(f"ref={e['ref']}")
          PY

      - name: check out the pinned engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.ref }}
          path: engine-src

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-src
          key: delvec-${{ steps.engine.outputs.ref }}

      # Selected by BINARY name, never by package name. The engine's compiler
      # package has been renamed once already, and a build command that names the
      # package is a value that moves underneath a pin nobody re-tests: the same
      # command spelled `-p <package>` was correct at one pin and a hard failure
      # at the next, with nothing in between to say so. `[[bin]] name = "delvec"`
      # is stable across that rename and is the name ADR-0016 gives the engine.
      - name: build delvec
        working-directory: engine-src
        run: cargo build --release --bin delvec

      - name: record the engine this campaign is built with
        env:
          ENGINE_REPO: ${{ steps.engine.outputs.repo }}
          ENGINE_REF: ${{ steps.engine.outputs.ref }}
        run: |
          set -euo pipefail
          echo "engine ${ENGINE_REPO}@${ENGINE_REF}"
          engine-src/target/release/delvec --version

      # Static ladder, stage one: schema + referential + text fit + l10n sidecar
      # coverage. Language-independent apart from the sidecar checks, so it runs
      # once for the whole campaign.
      - name: validate
        env:
          CAMPAIGN: ${{ matrix.campaign }}
        run: |
          set -euo pipefail
          engine-src/target/release/delvec validate \
            "campaigns/${CAMPAIGN}" --prefabs prefabs

      # Stage two: the full deterministic build (implies validate + analyze), in
      # the canonical English and in every language the campaign declares — an
      # emission defect can be language-specific, and a localized build is what
      # a playtest is run on.
      - name: build every declared language
        env:
          CAMPAIGN: ${{ matrix.campaign }}
        run: |
          set -euo pipefail
          langs=$(python3 -c '
          import json, sys
          w = json.load(open(sys.argv[1]))
          print(" ".join(["en", *w["content"].get("languages", [])]))
          ' "campaigns/${CAMPAIGN}/world.json")
          echo "languages: ${langs}"
          fail=0
          for lang in ${langs}; do
            echo "--- building ${CAMPAIGN} (--lang ${lang}) ---"
            if ! engine-src/target/release/delvec build \
                 "campaigns/${CAMPAIGN}" \
                 -o "${RUNNER_TEMP}/delve-${CAMPAIGN}-${lang}" \
                 --prefabs prefabs --lang "${lang}"; then
              echo "::error::${CAMPAIGN} does not build at --lang ${lang}"
              fail=1
            fi
          done
          exit "${fail}"

  # THE CONTEXT BRANCH PROTECTION HOLDS, and the only one in this workflow that
  # can be held. `build` above reports as `build <campaign> (validate + analyze
  # + emit)` — a name that changes with the campaign set, while protection
  # matches by NAME STRING, so requiring it would name contexts that appear and
  # vanish as campaigns land. This job's name does not move.
  #
  # `if: always()` is not a condition, it is the ABSENCE of one, and it is what
  # makes this a gate rather than a green square. A summary job without it is
  # SKIPPED the moment a need fails — and GitHub counts a skipped required check
  # as SATISFIED, so the gate would report green exactly when it should report
  # red. That is why the assertion below reads `result` for every need instead of
  # relying on the dependency edge: `failure`, `cancelled` and `skipped` are all
  # reds here, and `skipped` is the one that matters, because it is what a matrix
  # leg reports when it was never scheduled at all.
  #
  # It also refuses an EMPTY matrix. A summary over zero legs would find no
  # non-success result and pass, which is a gate examining nothing — the vacuity
  # this workflow's discovery step already refuses at its own end. Both ends
  # refuse, because the count travels between them as a string and a summary that
  # trusted its producer would be believing a value rather than checking one.
  gate:
    name: every campaign builds
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every campaign that exists was built
        env:
          # One value carrying every need's result and outputs, so the assertion
          # reads what GitHub reports rather than what this file assumes.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          errors = []

          # 1. Every leg reached `success`. A leg that failed, was cancelled, or
          #    never ran is a red — and the last is the one a naive summary calls
          #    a pass, because a job nothing scheduled has nothing to report.
          for job in sorted(needs):
              result = needs[job].get("result")
              if result != "success":
                  errors.append(
                      f"job `{job}` reported `{result}`, not `success`. A leg "
                      f"that failed, was cancelled, or never ran is not a leg "
                      f"that passed — a matrix that was never scheduled reports "
                      f"`skipped`, which is what an unguarded summary would let "
                      f"through as green")

          # 2. The matrix was not empty. Read from the producer's own stated
          #    count rather than inferred from the legs, because zero legs is
          #    exactly the state that leaves nothing to infer from.
          out = needs.get("discover", {}).get("outputs", {})
          try:
              count = int(out.get("count", ""))
          except ValueError:
              count = -1
          if count <= 0:
              errors.append(
                  f"the discovery job reported {out.get('count')!r} campaigns, so "
                  f"this gate examined nothing. A summary over zero legs that "
                  f"reports success is a gate that binds to nothing, which is not "
                  f"a pass")

          # 3. The count and the list agree. They are emitted by one step, so a
          #    disagreement means the output file was written by something other
          #    than that step.
          try:
              ids = json.loads(out.get("campaigns", "[]"))
          except json.JSONDecodeError:
              ids = None
          if ids is None or (count >= 0 and len(ids) != count):
              errors.append(
                  f"the discovery job reported count={out.get('count')!r} and "
                  f"campaigns={out.get('campaigns')!r}, which do not agree")

          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)
          print(f"every campaign builds: {count} campaign(s) — {', '.join(ids)}")
          print(f"excluded and counted: {out.get('excluded')}")
          PY
