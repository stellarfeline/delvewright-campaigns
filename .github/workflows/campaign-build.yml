name: campaign build

# Every UNRELEASED campaign in this repo compiles with the engine a creator
# authors against, on every push and every pull request.
#
# What this gate asserts. A campaign that is still being authored must compile
# with the engine its author is using — `versions.toml` `[engine].authoring_ref`,
# the revision `/new-delve` Init step 2 tells them to build. That is the only
# claim this repository can make and keep: it is the engine every refusal,
# picture and diagnostic in a generation run comes from, so a red here is a
# defect the author would have met, in the words they would have read.
#
# What it does not assert, and must not. A RELEASED campaign carries a
# `release/<id>/v*` tag. It is never edited again, and it is built only by the
# engine it pins, at that tag, by `release.yml`. Building it here against an
# engine that keeps moving would assert a compatibility nobody promises —
# nothing owes compatibility to anything already built — and the red would name
# the one campaign that cannot be repaired. So a released campaign is excluded
# by name, with its tags printed, and `release/*/v*` tags are fetched before the
# gate runs so the exclusion binds to what the repository has actually published.
#
# The engine's own direction is the mirror of this: it never builds old
# campaigns to prove compatibility either. The two repositories keep one rule
# between them and neither carries the other's job.
#
# What this gate is, and is not. The STATIC ladder — `delvec validate` (schema +
# referential + text fit + l10n sidecars) and `delvec build` (placement,
# reachability, emission) — per eligible campaign, per push, in every language
# the campaign declares. The RUNTIME ladder (PackTest, the bot playthrough, the
# multi-arch image) belongs to `release.yml`, on a release tag. That is the
# tiered-testing split applied to the repository where campaigns live.
#
# Which pin, and what moving it costs. `[engine].authoring_ref` is registered in
# `.github/pins.toml` as `engine-authoring`, and its policy is unchanged by this
# job: `builds` stays empty, so upstream drift is not a finding for it, and it
# moves only when somebody has walked `/new-delve` Init end to end against a
# candidate. This job reads the revision out of `versions.toml` at run time and
# writes no second copy of it — a literal here would be a pin held in two places,
# which `tools/check-pins.py` and `tools/check-authoring-pin.py` both refuse.
#
# Credentials. Both repos are public, so the cross-repo checkout needs no
# credential of its own; the default GITHUB_TOKEN reaches the engine repo, same
# as `prefab-audit.yml`. That is not cosmetic: GitHub withholds secrets from
# fork-based pull requests, so a cross-repo PAT here would leave the community
# contribution path as the one path this gate did not cover.

on:
  # NO PATH FILTER, and the reason is the one `prefab-audit.yml` records beside
  # its own dropped filter. `every campaign builds` below is a REQUIRED status
  # check, and branch protection matches a context by its NAME STRING: a pull
  # request whose files matched none of the filters produces no run, the context
  # never reports, and the merge blocks forever — including the pull request that
  # would fix it. This repository has already shipped that deadlock once.
  #
  # A filter is the wrong instrument for the saving anyway. The driver states its
  # binding count against a denominator and names what it excluded, so a change
  # touching no campaign gets an honest "2 of 2 campaigns examined, 0 excluded"
  # rather than a silence protection cannot tell from a pass.
  #
  # What the filter bought was measured rather than guessed, over the whole
  # population: of 88 pull requests, 72 matched the filter and 16 produced no run
  # and therefore no status. Those 16 are what a required context would have
  # blocked forever — and two of them are the pull requests that added the
  # never-reporting-check repair and the lockstep checker itself, so the deadlock
  # would have blocked its own two repairs. The run costs about four minutes and
  # nothing in money: this repository is public, so its Actions minutes are free.
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ONE JOB, and the name is the whole point of the shape.
  #
  # This job's name is the REQUIRED status check, and branch protection matches a
  # context by its NAME STRING. That one fact rules out both shapes this workflow
  # tried first. A matrix job reports as `name (value)`, so `build <campaign>`
  # named contexts that appear and vanish as campaigns land — a required name no
  # run reports blocks every pull request forever, including the one that would
  # fix it. And a summary job over such a matrix needs `if: always()` to survive a
  # failing leg, while a job-level `if:` is itself disqualifying, because a
  # skipped job reports `skipped` and GitHub counts that as a SATISFIED required
  # check. Neither can be held, and the enumeration was exhaustive rather than
  # argued: three jobs across four declarable states, sixty-four combinations,
  # none of them legal.
  #
  # One job walking the population itself can be held, which is the shape
  # `prefab-audit.yml` next door already uses and for the same reason. The cost is
  # real and was measured before it was paid: the campaigns no longer build
  # concurrently, so the run goes from about 2m50s to about 4m, and the
  # per-campaign check rows are gone — but those rows were never a thing branch
  # protection could hold. The engine is built once instead of once per campaign,
  # which the collapse gets back.
  build:
    name: every campaign builds
    runs-on: ubuntu-latest
    steps:
      # With LFS: `delvec build` copies the prefab `.nbt` bodies into the
      # datapack, and an LFS pointer is not an NBT file.
      - name: check out content repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The release tags decide which campaigns this gate does NOT build, and
      # `actions/checkout` does not bring them. A missing tag set excludes
      # nothing and reads exactly like a repository that has published nothing,
      # so the fetch is its own step and fails loudly rather than an option that
      # can be silently dropped. The driver cross-checks the result against the
      # remote anyway and refuses a local set that is short.
      - name: fetch the release tags the exclusion is drawn from
        run: git fetch --tags --force origin

      # `[engine].authoring_ref`, never `[engine].ref`. The release pin names the
      # engine a PUBLISHED delve reproduces through and must not move; this names
      # the engine an author works with, and it is the one this gate's claim is
      # about. Read from the manifest at run time so no second copy of the
      # revision exists here.
      - name: read the authoring engine from versions.toml
        id: engine
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          e = tomllib.load(open("versions.toml", "rb"))["engine"]
          print(f"repo={e['repo']}")
          print(f"ref={e['authoring_ref']}")
          PY

      - name: check out the authoring engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.ref }}
          path: engine-src

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-src
          key: delvec-${{ steps.engine.outputs.ref }}

      # ONCE, for every campaign — which is what collapsing the matrix gets back.
      # Selected by BINARY name, never by package name: the engine's compiler
      # package has been renamed once already, and a build command that names the
      # package is a value that moves underneath a pin nobody re-tests. The same
      # command spelled `-p <package>` was correct at one pin and a hard failure
      # at the next, with nothing in between to say so. `[[bin]] name = "delvec"`
      # spans that rename.
      - name: build delvec
        working-directory: engine-src
        run: cargo build --release --bin delvec

      - name: record the authoring engine these campaigns are built with
        env:
          ENGINE_REPO: ${{ steps.engine.outputs.repo }}
          ENGINE_REF: ${{ steps.engine.outputs.ref }}
        run: |
          set -euo pipefail
          echo "engine ${ENGINE_REPO}@${ENGINE_REF}"
          engine-src/target/release/delvec --version

      # The whole of the check lives in the script, not in this YAML, so a
      # creator runs exactly what CI runs with one command and no workflow
      # runner. It discovers the population, names every released campaign it
      # excluded and the tags that released it, refuses a campaign that has lost
      # its entry document, refuses a tag set the remote says is short, refuses a
      # zero binding where anything was eligible, and reconciles every eligible
      # campaign against a result at the end — so a walk that stopped early
      # cannot report on the part it reached and stay silent about the part it
      # did not.
      #
      # `--branch` is the ref this run's result LANDS ON — a pull request's base,
      # or the branch being pushed — which is what tells an eligible campaign on
      # `main` from one still being authored. An in-progress campaign lives on
      # its own `campaign/<id>` branch and does not build yet, because
      # `/new-delve` stops at the design gate with `quests.json` unwritten; work
      # landing on that branch reports its findings and does not count them, and
      # every other eligible campaign still must build. The BASE and not the
      # head, because the acceptance pull request from `campaign/<id>` into
      # `main` carries that head and is the one run where the campaign must
      # build — reading the head would excuse the merge that ships it. Empty on
      # a push, which excuses nothing, and `github.ref_name` then supplies
      # `main`.
      - name: every campaign builds, in every language it declares
        env:
          LANDS_ON: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/campaign-build.py \
            --delvec engine-src/target/release/delvec \
            --prefabs prefabs \
            --out "${RUNNER_TEMP}/delves" \
            --branch "${LANDS_ON}" \
            --github
