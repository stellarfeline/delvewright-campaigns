# Content-repo version manifest — which pipeline builds this content.
#
# The main repo (`delvewright`, GPL pipeline code) pins THIS repo in its own
# `versions.toml` `[content].sha`, so a main-repo CI run is reproducible. This
# file is the other direction: which engine *release* of this content is built
# and validated with. Both pins together make a released delve reproducible from
# one commit id and one release tag and nothing else (ADR-0006).
#
# RE-PIN CONVENTION: bump `[engine].ref` in a normal reviewed PR when a release
# needs newer compiler behaviour. A release tag always builds with whatever this
# file names at the tagged commit — never with "latest".
#
# NOTE: `.github/workflows/prefab-audit.yml` carries its own, deliberately
# different pin (`ADMIT_REF`): it names the main-repo commit the AUDIT is built
# from, which is a property of the rules a piece is judged by, not of the
# compiler a release ships. They may name the same engine without being one pin.
#
# No pin's terms live in a comment. Every one is registered in
# `.github/pins.toml`, and `tools/ci/check-pins.py` is what holds it to those
# terms.

[engine]
# The main repo and the ref `release.yml` checks out to build + validate a
# release. It is a public repo, so the checkout needs no credential of its own;
# the default GITHUB_TOKEN reaches it, same as prefab-audit.yml.
repo = "stellarfeline/delvewright"
# A RELEASE TAG in the engine's own grammar (`<name>--v<semver>`, ADR-0028), not
# a main tip: the pin names something immutable and published, and the registry
# holds it to a tag the engine really carries whose commit's tree states that
# same version. This pin's only reader is `release.yml`, so nothing else can
# notice it going stale — which is why its terms are registered rather than
# written here, and why `release.yml` additionally refuses to publish when the
# engine it checks out is older than the version the campaign's storybook says
# it was verified with.
ref = "delvec--v1.6.0"
# The engine an author works with is NOT pinned here any more. The `/new-delve`
# page left this repository (spec-0063): it ships as a Claude Code plugin from
# the engine repository's own marketplace, and the plugin carries its own
# `versions.toml` naming the revision its Init clones and the release its Init
# downloads. This file names one engine and one only — the one a RELEASE of this
# content is built and validated with.

[registry]
# Where a released delve image is published. `delve-<campaign>` per campaign,
# tagged `v<semver>` (immutable) plus `latest`.
image_prefix = "ghcr.io/stellarfeline/delve-"
