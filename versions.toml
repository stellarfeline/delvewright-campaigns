# Content-repo version manifest — which pipeline builds this content.
#
# The main repo (`delvewright`, GPL pipeline code) pins THIS repo in its own
# `versions.toml` `[content].sha`, so a main-repo CI run is reproducible. This
# file is the other direction: which main-repo commit a *release* of this
# content is built and validated with. Both pins together make a released delve
# reproducible from two commit ids and nothing else (ADR-0006).
#
# RE-PIN CONVENTION: bump `[engine].ref` in a normal reviewed PR when a release
# needs newer compiler behaviour. A release tag always builds with whatever this
# file names at the tagged commit — never with "latest".
#
# NOTE: `.github/workflows/prefab-audit.yml` carries its own, deliberately
# different pin (`ADMIT_REF`): it names the main-repo commit the AUDIT is built
# from, which is a property of the rules a piece is judged by, not of the
# compiler a release ships. Do not collapse the two — one must never move and the
# other must not be allowed to sit still unexamined.
#
# Neither pin's terms live in a comment. Both are registered in
# `.github/pins.toml`, and `tools/check-pins.py` is what holds them to those
# terms: the release pin must be a commit a release tag points at, and the audit
# pin is measured against the sources it builds, in the job that builds them.

[engine]
# The main repo and the commit `release.yml` checks out to build + validate a
# release. It is a public repo, so the checkout needs no credential of its own;
# the default GITHUB_TOKEN reaches it, same as prefab-audit.yml.
repo = "stellarfeline/delvewright"
# Engine release `v1.1.0` (delvec 1.1.0) — the TAGGED release commit, not a
# main tip, so the pin names something immutable and published. The island
# was built on this engine in both languages and byte-identically by two
# independent channels (the crates.io install and the release shelf binary),
# which is what the README marker below now records.
#
# This pin was 75 commits stale until 2026-08-05 — it still named the spec-0024
# docs PR that first carried the ladder inputs, so a release tag pushed at any
# point since would have built the island with an engine predating almost
# everything rounds 19-22 depend on: `DW0497` uniform wave machinery (#280, the
# round-21 blocker), the per-NPC walk supersede (#287), branch-aware inter-area
# transport (#276), cast-ledger talk-to positions (#284). Nothing checked it,
# because the pin's only reader is `release.yml` and no release had ever run.
# `.github/workflows/release.yml` now refuses to publish when the engine it
# checks out is older than the version the campaign's storybook says it was
# verified with.
ref = "91a9a843d2ad2f0c3b852ea5fa4178567b68f875"

[registry]
# Where a released delve image is published. `delve-<campaign>` per campaign,
# tagged `v<semver>` (immutable) plus `latest`.
image_prefix = "ghcr.io/stellarfeline/delve-"
